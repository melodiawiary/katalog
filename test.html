<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Melodia Wiary - v69</title>
    <style>
        :root { 
            --active-orange: #fbda80;
            --bg: #f4f9f8; --card-bg: #f9fffe;
            --soft-cyan: #d2e9e6; --deep-brown: #3b2a00; --sidebar-width: 220px;
        }
        
        body.standard { 
            --f-size: 16px;
            --f-btn: 13px; --f-ctrl: 11px; --f-search: 1.1em; 
            --f-card-title: 14px; --f-list-title: 1em;
        }
        body.senior { 
            --f-size: 22px;
            --f-btn: 18px; --f-ctrl: 16px; --f-search: 1.4em; 
            --f-card-title: 20px; --f-list-title: 1.4em;
        }

        body { background: var(--bg); color: var(--deep-brown); font-family: 'Segoe UI', sans-serif; margin: 0;
            display: flex; min-height: 100vh; font-size: var(--f-size); overflow-x: hidden; }

        /* SIDEBAR */
        #sidebar { width: var(--sidebar-width);
            background: var(--card-bg); border-right: 4px solid var(--active-orange); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-top { padding: 15px 10px; text-align: center;
            border-bottom: 1px solid rgba(59, 42, 0, 0.08); }
        .sidebar-scroll { flex-grow: 1;
            overflow-y: auto; padding: 10px; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%;
            border: 3px solid var(--active-orange); background: white; object-fit: cover; margin-bottom: 15px;
            }
        
        .section-label { font-size: 16px;
            font-weight: 900; color: var(--deep-brown); text-transform: uppercase; margin: 15px 0 0 0; display: block; border-bottom: 3px solid var(--active-orange); padding-bottom: 5px;
            text-align: center;
            }
        
        .nav-btn, .size-btn { width: 100%;
            padding: 12px 10px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid var(--deep-brown); cursor: pointer; font-weight: 800; text-align: left; text-transform: uppercase;
            font-size: var(--f-btn); background: var(--soft-cyan); color: var(--deep-brown); display: flex;
            align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s; box-sizing: border-box;
            }
        
        .nav-btn:hover { background: var(--active-orange);
            transform: scale(1.02); }
        
        .nav-btn.active, .size-btn.active { 
            background: var(--active-orange) !important;
            border: 3px solid var(--deep-brown) !important; 
            transform: scale(1.02); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
            
        .nav-btn.fav-btn { background: #fff1f1;
            border-color: #ffb3b3;
            align-items: center; justify-content: center; text-align: center; padding: 10px; min-height: 40px; margin-bottom: 5px;
            }

        /* MAIN CONTENT */
        #main-content { margin-left: var(--sidebar-width);
            flex: 1; display: flex; flex-direction: column; width: calc(100% - var(--sidebar-width));
            }
        .header-sticky { position: sticky; top: 0;
            z-index: 950; background: var(--bg); width: 100%;
            box-sizing: border-box; display: flex; flex-direction: column; }
        
        .top-padding { display: flex;
            width: 100%; box-sizing: border-box; gap: 0; padding: 0; align-items: stretch; }
        
        .header-left { width: 50%;
            padding: 20px 25px 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .header-right { width: 50%;
            background: #fff5f5; border-left: 2px solid var(--active-orange); box-sizing: border-box; padding: 20px 25px 15px 25px; display: flex; flex-direction: column;
            }
        
        .top-header-title { font-weight: 900;
            text-transform: uppercase; font-size: 1.1em; text-align: center; margin-bottom: 10px; color: var(--deep-brown); line-height: 1.2;
            background: #ffcccc; border: 2px solid var(--deep-brown); padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box;
            }
        
        .top-btn-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            border: 2px solid var(--deep-brown); 
            border-radius: 8px; 
            overflow: hidden;
            cursor: pointer;
        }
        .top-btn-text-part { 
            height: 33.33%; 
            background: var(--active-orange); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 8px; 
            font-weight: 900; 
            text-transform: uppercase; 
            font-size: 18px; 
            line-height: 1.1;
            border-bottom: 2px solid var(--deep-brown);
        }
        .top-btn-ad-part { 
            flex-grow: 1; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: 900; 
            color: var(--deep-brown);
            text-transform: uppercase;
            line-height: 1.2;
        }

        .search-box { width: 100%;
            padding: 12px; border-radius: 15px; border: 2px solid var(--deep-brown);
            font-size: var(--f-search); font-weight: bold; text-align: center; background: var(--card-bg); box-sizing: border-box;
            }

        .alpha-shelf { border-top: 3px solid var(--active-orange);
            border-bottom: 3px solid var(--active-orange); background: var(--bg);
            padding: 10px 25px; display: none;
            }
        #alpha-row { display: flex; flex-wrap: wrap;
            gap: 6px; justify-content: flex-start;
            }

        .view-title-header { background: var(--soft-cyan); color: var(--deep-brown); padding: 15px 25px; font-weight: 900;
            text-transform: uppercase; font-size: 1.2em; border-bottom: 2px solid var(--deep-brown);
            }

        /* GRID SYSTEM */
        #content-area { display: flex; flex: 1; position: relative; }
        .list-column { width: 50%; padding: 20px 25px; box-sizing: border-box; }
        
        /* ZMIANA PUNKTOWA: Blokada chowania się pod pasek ulubione/nagłówek */
        .disc-column { 
            width: 50%; 
            padding: 20px 25px; 
            box-sizing: border-box; 
            border-left: 2px solid var(--active-orange);
            position: sticky; 
            top: 180px; /* Dopasowane do wysokości header-sticky */
            height: calc(100vh - 180px); 
            overflow-y: auto; 
            align-self: flex-start;
        }

        .item-card { background: var(--card-bg); border: 1px solid rgba(59, 42, 0, 0.1); border-radius: 12px;
            padding: 12px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px;
            }
        .item-card:hover { border-color: var(--active-orange); background: white; transform: translateX(5px); }
        .item-card.active { border: 3px solid var(--active-orange); background: #fffdf7; }

        .disc-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 2px solid var(--deep-brown); margin-bottom: 15px; }
        
        .player-frame { width: 100%; height: 200px; border-radius: 12px; border: 2px solid var(--deep-brown); overflow: hidden; margin-top: 15px; }

        #fav-count { background: var(--deep-brown); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-left: 5px; }
        
        .loading { padding: 40px; text-align: center; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body class="standard">

<div id="sidebar">
    <div class="sidebar-top">
        <img src="https://i.postimg.cc/mD79N76X/image.png" class="logo-img" alt="Logo">
        <div style="font-weight: 900; font-size: 14px; text-transform: uppercase;">Katalog Płyt</div>
    </div>
    <div class="sidebar-scroll">
        <button class="nav-btn fav-btn" onclick="showFavorites()">
            ❤️ ULUBIONE <span id="fav-count">0</span>
        </button>
        
        <span class="section-label">ROZMIAR TEKSTU</span>
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="size-btn active" id="btn-std" onclick="setTextSize('standard')">ABC</button>
            <button class="size-btn" id="btn-snr" onclick="setTextSize('senior')">ABC+</button>
        </div>

        <span class="section-label">KATEGORIE</span>
        <div id="category-menu"></div>
    </div>
</div>

<div id="main-content">
    <div class="header-sticky">
        <div class="top-padding">
            <div class="header-left">
                <input type="text" class="search-box" id="search-input" placeholder="Wyszukaj wykonawcę lub tytuł..." oninput="handleSearch()">
            </div>
            <div class="header-right">
                <div class="top-header-title">Moje Ulubione</div>
                <div class="top-mini-grid" id="mini-fav-grid">
                    <!-- Tu wpadną 3 ostatnie ulubione -->
                </div>
            </div>
        </div>

        <div class="alpha-shelf" id="alpha-shelf">
            <div id="alpha-row"></div>
        </div>

        <div class="view-title-header" id="current-view-title">Wszystkie utwory</div>
    </div>

    <div id="content-area">
        <div class="list-column" id="items-list">
            <div class="loading">Ładowanie bazy utworów...</div>
        </div>
        <div class="disc-column" id="details-panel">
            <div style="text-align: center; padding-top: 50px; color: #999;">
                Wybierz utwór z listy, aby zobaczyć szczegóły i okładkę.
            </div>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS68U68K_yXvjWp6L0o_8l_8-9p8_qf-9-9-9/pub?output=csv'; // Przykładowy link
    const STORAGE_KEY = 'melodia_wiary_favs_v69';
    let allData = [];
    let currentCategory = 'ALL';
    let currentLetter = 'ALL';
    let favorites = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    async function loadData() {
        try {
            // Symulacja danych lub fetch
            allData = [
                { id: '1', wykonawca: 'Arka Noego', tytul: 'Tato', kategoria: 'Dla dzieci', youtube: 'dQw4w9WgXcQ', img: 'https://via.placeholder.com/300' },
                { id: '2', wykonawca: 'TGD', tytul: 'Wiara', kategoria: 'Uwielbienie', youtube: 'dQw4w9WgXcQ', img: 'https://via.placeholder.com/300' }
            ];
            renderMenu();
            renderAlpha();
            renderList();
            updateFavUI();
        } catch (e) {
            document.getElementById('items-list').innerHTML = "Błąd ładowania danych.";
        }
    }

    function setTextSize(mode) {
        document.body.className = mode;
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode === 'standard' ? 'btn-std' : 'btn-snr').classList.add('active');
    }

    function renderMenu() {
        const cats = ['ALL', ...new Set(allData.map(d => d.kategoria))];
        const menu = document.getElementById('category-menu');
        menu.innerHTML = cats.map(c => `
            <button class="nav-btn ${currentCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">
                ${c === 'ALL' ? '🏠 WSZYSTKO' : c}
            </button>
        `).join('');
    }

    function renderAlpha() {
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const row = document.getElementById('alpha-row');
        row.innerHTML = `<button class="alpha-btn ${currentLetter === 'ALL' ? 'active' : ''}" onclick="setLetter('ALL')">WSZYSTKIE</button>` +
            letters.map(l => `<button class="alpha-btn ${currentLetter === l ? 'active' : ''}" onclick="setLetter('${l}')">${l}</button>`).join('');
    }

    function setCategory(c) {
        currentCategory = c;
        currentLetter = 'ALL';
        document.getElementById('alpha-shelf').style.display = (c === 'ALL') ? 'none' : 'block';
        renderMenu();
        renderAlpha();
        renderList();
    }

    function setLetter(l) {
        currentLetter = l;
        renderAlpha();
        renderList();
    }

    function handleSearch() {
        renderList();
    }

    function renderList() {
        const query = document.getElementById('search-input').value.toLowerCase();
        let filtered = allData;

        if (currentCategory !== 'ALL') filtered = filtered.filter(d => d.kategoria === currentCategory);
        if (currentLetter !== 'ALL') filtered = filtered.filter(d => d.wykonawca.startsWith(currentLetter));
        if (query) filtered = filtered.filter(d => d.wykonawca.toLowerCase().includes(query) || d.tytul.toLowerCase().includes(query));

        const list = document.getElementById('items-list');
        document.getElementById('current-view-title').innerText = currentCategory === 'ALL' ? 'Wszystkie utwory' : currentCategory;

        if (filtered.length === 0) {
            list.innerHTML = "<div style='padding:20px;'>Nic nie znaleziono.</div>";
            return;
        }

        list.innerHTML = filtered.map(d => `
            <div class="item-card" onclick="showDetails('${d.id}')">
                <div style="flex:1">
                    <div style="font-weight:900; font-size: var(--f-list-title);">${d.wykonawca}</div>
                    <div style="font-size: 0.9em; opacity:0.8;">${d.tytul}</div>
                </div>
                <button onclick="event.stopPropagation(); toggleFav('${d.id}')" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">
                    ${favorites.includes(d.id) ? '❤️' : '🤍'}
                </button>
            </div>
        `).join('');
    }

    function showDetails(id) {
        const d = allData.find(x => x.id === id);
        const panel = document.getElementById('details-panel');
        panel.innerHTML = `
            <img src="${d.img}" class="disc-img">
            <h2 style="margin:0; font-weight:900;">${d.wykonawca}</h2>
            <p style="margin:5px 0 20px 0;">${d.tytul}</p>
            <div class="player-frame">
                <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${d.youtube}" frameborder="0" allowfullscreen></iframe>
            </div>
        `;
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    }

    function toggleFav(id) {
        if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
        else favorites.push(id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
        updateFavUI();
        renderList();
    }

    function updateFavUI() {
        document.getElementById('fav-count').innerText = favorites.length;
        const miniGrid = document.getElementById('mini-fav-grid');
        const last3 = favorites.slice(-3).reverse();
        miniGrid.innerHTML = last3.map(id => {
            const d = allData.find(x => x.id === id);
            return d ? `<div class="top-btn-container" onclick="showDetails('${d.id}')"><div class="top-btn-text-part">${d.wykonawca.substring(0,6)}</div><div class="top-btn-ad-part">...</div></div>` : '';
        }).join('');
    }

    window.onload = loadData;
</script>

</body>
</html>
