<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Melodia Wiary - v66</title>
    <style>
        :root { 
            --active-orange: #fbda80;
            --bg: #f4f9f8; --card-bg: #f9fffe;
            --soft-cyan: #d2e9e6; --deep-brown: #3b2a00; --sidebar-width: 220px;
        }
        
        body.standard { --f-size: 16px; --f-btn: 13px; --f-ctrl: 11px; --f-search: 1.1em; --f-card-title: 14px; --f-list-title: 1em; }
        body.senior { --f-size: 22px; --f-btn: 18px; --f-ctrl: 16px; --f-search: 1.4em; --f-card-title: 20px; --f-list-title: 1.4em; }

        body { background: var(--bg); color: var(--deep-brown); font-family: 'Segoe UI', sans-serif; margin: 0;
            display: flex; min-height: 100vh; font-size: var(--f-size); overflow-x: hidden; }

        /* SIDEBAR */
        #sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 4px solid var(--active-orange); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-top { padding: 15px 10px; text-align: center; border-bottom: 1px solid rgba(59, 42, 0, 0.08); }
        .sidebar-scroll { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--active-orange); background: white; object-fit: cover; margin-bottom: 15px; }
        .section-label { font-size: 16px; font-weight: 900; color: var(--deep-brown); text-transform: uppercase; margin: 15px 0 0 0; display: block; border-bottom: 3px solid var(--active-orange); padding-bottom: 5px; text-align: center; }
        .nav-btn, .size-btn { width: 100%; padding: 12px 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--deep-brown); cursor: pointer; font-weight: 800; text-align: left; text-transform: uppercase; font-size: var(--f-btn); background: var(--soft-cyan); color: var(--deep-brown); display: flex; align-items: center; gap: 8px; transition: 0.2s; box-sizing: border-box; }
        .nav-btn:hover { background: var(--active-orange); transform: scale(1.02); }
        .nav-btn.active, .size-btn.active { background: var(--active-orange) !important; border: 3px solid var(--deep-brown) !important; transform: scale(1.02); }
        .nav-btn.fav-btn { background: #fff1f1; border-color: #ffb3b3; align-items: center; justify-content: center; text-align: center; padding: 10px; min-height: 40px; margin-bottom: 5px; }

        /* MAIN */
        #main-content { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; width: calc(100% - var(--sidebar-width)); }
        .header-sticky { position: sticky; top: 0; z-index: 950; background: var(--bg); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        .top-padding { display: flex; width: 100%; box-sizing: border-box; gap: 0; padding: 0; align-items: stretch; }
        .header-left { width: 50%; padding: 20px 25px 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .header-right { width: 50%; background: #fff5f5; border-left: 2px solid var(--active-orange); box-sizing: border-box; padding: 20px 25px 15px 25px; display: flex; flex-direction: column; }
        .search-box { width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--deep-brown); font-size: var(--f-search); font-weight: bold; text-align: center; background: var(--card-bg); box-sizing: border-box; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        .ctrl-btn { flex: 1; padding: 12px 4px; border: 1px solid var(--deep-brown); background: var(--soft-cyan); color: var(--deep-brown); font-weight: 800; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-size: var(--f-ctrl); transition: 0.2s; }
        .ctrl-btn:hover { background: var(--active-orange); transform: scale(1.02); }
        .ctrl-btn.active { background: var(--active-orange) !important; border: 2.5px solid var(--deep-brown); }

        .view-title-header { background: var(--soft-cyan); color: var(--deep-brown); padding: 15px 25px; font-weight: 900; text-transform: uppercase; font-size: 1.5em; border-bottom: 5px solid var(--active-orange); border-top: 2px solid var(--active-orange); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }

        #main-display { padding: 0 0 100px 0; min-height: 100vh; width: 100%; }
        .display-padding { padding: 0 25px; width: 100%; box-sizing: border-box; }
        
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .list-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }

        /* ULUBIONE LAYOUT */
        .cart-split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px; align-items: start; }
        .cart-column { display: flex; flex-direction: column; gap: 10px; }

        /* CARDS */
        .card { background: var(--card-bg); border: 2px solid rgba(59, 42, 0, 0.08); padding: 12px; border-radius: 15px; text-align: center; position: relative; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .card:hover { border: 2px solid var(--deep-brown); background: var(--soft-cyan); transform: translateY(-5px); }
        .thumb-container { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(0,0,0,0.05); position: relative; }
        .thumb { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-weight: 900; font-size: var(--f-card-title); text-transform: uppercase; padding: 5px; line-height: 1.2; }
        .play-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--active-orange); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: var(--deep-brown); font-weight: 900; text-align: center; padding: 10px; font-size: 0.9em; text-transform: uppercase; border: 2px solid var(--deep-brown); border-radius: 10px; box-sizing: border-box; }
        .card:hover .play-overlay { opacity: 1; }
        .list-card { background: var(--card-bg); border: 2px solid rgba(59, 42, 0, 0.08); border-radius: 10px; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; min-height: 60px; position: relative; overflow: hidden; }
        .list-card:hover { border: 2px solid var(--deep-brown); background: var(--active-orange); }
        .list-title { font-weight: 800; font-size: var(--f-list-title); flex: 1; padding-right: 10px; line-height: 1.2; text-transform: uppercase; color: var(--deep-brown); }
        .heart-btn { font-size: 24px; cursor: pointer; border: none; background: none; z-index: 5; position: relative; }
        .disk-arrow-btn { background: var(--active-orange); border: 2px solid var(--deep-brown); border-radius: 5px; font-weight: 900; cursor: pointer; padding: 5px 10px; margin-right: 10px; z-index: 6; position: relative; }

        /* DISK PROGRESS */
        .disk-progress-container { width: 100%; background: #eee; height: 35px; border-radius: 20px; border: 3px solid var(--deep-brown); position: relative; overflow: hidden; margin: 15px 0; }
        .disk-progress-bar { height: 100%; background: #4caf50; transition: width 0.4s ease; width: 0%; }
        .disk-progress-text { position: absolute; width: 100%; text-align: center; top: 7px; font-weight: 900; color: #000; text-shadow: 1px 1px 0px #fff; }

        @media (max-width: 1400px) { .list-container { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 900px) { .cart-split-view { grid-template-columns: 1fr; } .list-container { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body class="standard">
<div id="sidebar">
    <div class="sidebar-top">
        <img src="logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/120?text=LOGO'">
        <button class="nav-btn fav-btn" id="btn-cart" onclick="setView('cart')">❤️ MOJE ULUBIONE</button>
        <button class="nav-btn fav-btn" id="btn-top50-side" onclick="setView('top50')">🏆 TOP 50</button>
        <div style="margin-top:10px; padding:5px; border: 1px solid var(--deep-brown); border-radius:10px;">
           <button class="size-btn" id="s-std" onclick="updateSize('standard')">LITERY ZWYKŁE</button>
           <button class="size-btn" id="s-big" onclick="updateSize('senior')">LITERY DUŻE</button>
        </div>
        <span class="section-label">KATEGORIE</span>
    </div>
    <div class="sidebar-scroll"><div id="cat-list"></div></div>
</div>

<div id="main-content">
    <div class="header-sticky">
        <div class="top-padding">
            <div class="header-left">
                <input type="text" id="search" class="search-box" placeholder="SZUKAJ PIEŚNI..." onkeyup="doSearch()">
                <div class="btn-group">
                    <button class="ctrl-btn" id="s-new" onclick="setSort('newest')">Najnowsze</button>
                    <button class="ctrl-btn" id="s-az" onclick="setSort('az')">A-Z</button>
                    <button class="ctrl-btn" id="m-grid" onclick="setMode('grid')">Kafelki</button>
                    <button class="ctrl-btn" id="m-list" onclick="setMode('list')">Lista</button>
                </div>
            </div>
            <div class="header-right" id="top-panel"></div>
        </div>
        <div id="sticky-title-container"></div>
    </div>
    <div id="main-display"></div>
</div>

<script>
    const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSIMZUO8ZkisiFoqOfypL9hOQBnTbAvtMmBeIuK56_QoiXFu_b7i-de1Jn6Km9symosxJBV6V5PxKO/pub?output=csv';
    const CSV_TOP = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeNOmR7SJ-G5j8DMMXjR1KE4h5w1UiNY5nHhV1mvGNJ63I_-3SQPDMNxNFpakUL4VLFacWFUOmycPB/pub?gid=1082900381&single=true&output=csv';
    const STORAGE_KEY = 'melodia_wiary_permanent_storage'; 
    const DISK_KEY = 'melodia_wiary_disk_storage';

    let songs = [], top50 = [], cart = [], disk = [], currentView = 'all', displayMode = 'grid', query = "", sortType = 'newest';

    // FUNKCJA NAPRAWIONA: Wyciąga sekundy nawet jeśli format jest błędny
    function timeToSeconds(timeStr) {
        if (!timeStr) return 0;
        const parts = String(timeStr).split(':');
        if(parts.length === 2) return (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        if(parts.length === 1) return parseInt(parts[0]) || 0;
        return 0;
    }

    function secondsToTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    async function init() {
        let saved = localStorage.getItem(STORAGE_KEY);
        if(saved) cart = JSON.parse(saved);
        let savedDisk = localStorage.getItem(DISK_KEY);
        if(savedDisk) disk = JSON.parse(savedDisk);

        updateSize(localStorage.getItem('mv_font_permanent') || 'standard');

        try {
            const [r1, r2] = await Promise.all([ fetch(CSV), fetch(CSV_TOP) ]);
            const text1 = await r1.text();
            const text2 = await r2.text();

            const rows = text1.split(/\r?\n/).filter(x => x.trim() !== "").slice(1);
            let catsSet = new Set();
            songs = rows.map((line, index) => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const rawCats = (cols[1] || "Inne").replace(/"/g,'').split(',').map(c => c.trim());
                rawCats.forEach(c => { if(c.length > 2) catsSet.add(c) });
                return { 
                    tytul: (cols[0] || "Bez tytułu").replace(/"/g,''), 
                    kategorie: rawCats, 
                    yt: (cols[2] || "").trim().replace(/"/g,''), 
                    czas: (cols[3] || "3:00").trim().replace(/"/g,''), 
                    originalIndex: index 
                };
            });

            const catBox = document.getElementById('cat-list');
            Array.from(catsSet).sort().forEach(cat => {
                const b = document.createElement('button'); b.className = 'nav-btn'; b.innerText = cat; 
                b.onclick = () => setView(cat); catBox.appendChild(b);
            });
            render();
        } catch(e) { console.error(e); }
    }

    function toggleFav(t) {
        const idx = cart.findIndex(x => x.tytul === t);
        if(idx > -1) {
            cart.splice(idx, 1);
            disk = disk.filter(x => x.tytul !== t);
            localStorage.setItem(DISK_KEY, JSON.stringify(disk));
        } else { 
            const s = songs.find(x => x.tytul === t); 
            if(s) cart.push(s); 
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
        render();
    }

    function addToDisk(t) {
        const song = cart.find(x => x.tytul === t);
        if (!song || disk.some(x => x.tytul === t)) return;
        const currentTotal = disk.reduce((sum, s) => sum + timeToSeconds(s.czas), 0);
        const songTime = timeToSeconds(song.czas);
        if (currentTotal + songTime > 50 * 60) { alert("Płyta pełna (max 50 min)!"); return; }
        disk.push(song);
        localStorage.setItem(DISK_KEY, JSON.stringify(disk));
        render();
    }

    function removeFromDisk(t) {
        disk = disk.filter(x => x.tytul !== t);
        localStorage.setItem(DISK_KEY, JSON.stringify(disk));
        render();
    }

    function render() {
        const out = document.getElementById('main-display');
        const titleBox = document.getElementById('sticky-title-container');
        out.innerHTML = ''; titleBox.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'view-title-header';
        header.innerText = currentView === 'cart' ? '❤️ MOJE ULUBIONE' : currentView.toUpperCase();
        titleBox.appendChild(header);

        let list = (currentView === 'cart') ? [...cart] : (currentView === 'all' ? [...songs] : songs.filter(s => s.kategorie.includes(currentView)));
        if(query) list = list.filter(s => s.tytul.toLowerCase().includes(query));

        const content = document.createElement('div');
        content.className = 'display-padding';

        if(currentView === 'cart') {
            const split = document.createElement('div');
            split.className = 'cart-split-view';

            const left = document.createElement('div');
            left.className = 'cart-column';
            left.innerHTML = '<h3>Lista Ulubionych (Przewijana)</h3>';
            list.forEach(s => {
                const div = document.createElement('div');
                div.className = 'list-card';
                const jsT = s.tytul.replace(/'/g, "\\'");
                div.innerHTML = `
                    <span class="list-title" onclick="window.open('https://youtube.com/watch?v=${s.yt}')">${s.tytul} (${s.czas})</span>
                    <div>
                        <button class="disk-arrow-btn" onclick="addToDisk('${jsT}')">DODAJ DO PŁYTY ➔</button>
                        <button class="heart-btn" onclick="toggleFav('${jsT}')">❤️</button>
                    </div>`;
                left.appendChild(div);
            });

            const right = document.createElement('div');
            right.className = 'cart-column';
            const totalSec = disk.reduce((sum, s) => sum + timeToSeconds(s.czas), 0);
            const perc = Math.min(100, (totalSec / (50 * 60)) * 100);
            
            right.innerHTML = `
                <h3 style="text-align:center;">💿 PŁYTA NR 1 MELODIA WIARY</h3>
                <div class="disk-progress-container">
                    <div class="disk-progress-bar" style="width:${perc}%"></div>
                    <div class="disk-progress-text">ZAJĘTE: ${secondsToTime(totalSec)} / 50:00 (${Math.round(perc)}%)</div>
                </div>`;
            
            disk.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'list-card';
                div.style.minHeight = '40px';
                div.innerHTML = `<span class="list-title">${i+1}. ${s.tytul}</span><button class="heart-btn" onclick="removeFromDisk('${s.tytul.replace(/'/g, "\\'")}')">❌</button>`;
                right.appendChild(div);
            });

            split.appendChild(left); split.appendChild(right);
            content.appendChild(split);
        } else {
            const container = document.createElement('div');
            container.className = displayMode === 'grid' ? 'items-grid' : 'list-container';
            list.forEach(s => {
                const div = document.createElement('div');
                const isF = cart.some(x => x.tytul === s.tytul);
                const jsT = s.tytul.replace(/'/g, "\\'");
                if(displayMode === 'grid') {
                    div.className = 'card';
                    div.onclick = () => window.open('https://youtube.com/watch?v=${s.yt}');
                    div.innerHTML = `<div class="thumb-container"><img src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" class="thumb"><div class="play-overlay">GRAJ 🎶</div></div><div class="card-title">${s.tytul}</div><button class="ctrl-btn" style="margin-top:5px" onclick="event.stopPropagation(); toggleFav('${jsT}')">${isF?'USUŃ':'DODAJ'}</button>`;
                } else {
                    div.className = 'list-card';
                    div.innerHTML = `<span class="list-title" onclick="window.open('https://youtube.com/watch?v=${s.yt}')">${s.tytul}</span><button class="heart-btn" onclick="toggleFav('${jsT}')">${isF?'❤️':'🤍'}</button>`;
                }
                container.appendChild(div);
            });
            content.appendChild(container);
        }
        out.appendChild(content);
    }

    function setView(v) { currentView = v; render(); window.scrollTo(0,0); }
    function setSort(s) { sortType = s; render(); }
    function setMode(m) { displayMode = m; render(); }
    function doSearch() { query = document.getElementById('search').value.toLowerCase(); render(); }
    function updateSize(s) { document.body.className = s; localStorage.setItem('mv_font_permanent', s); }

    init();
</script>
</body>
</html>
