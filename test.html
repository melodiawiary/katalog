<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiovisual Archive v67</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --container-bg: #111;
            --text-color: #eee;
            --accent-color: #007bff;
            --card-bg: #1a1a1a;
            --column-width: 350px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app-container {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            width: 100%;
            position: relative;
        }

        /* Lewa kolumna i centrum */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* PRAWA KOLUMNA - POPRAWKA: TYLKO PRZESUWANIE GÓRA/DÓŁ, BRAK CHOWANIA */
        #right-sidebar {
            width: var(--column-width);
            flex-shrink: 0;
            position: sticky;
            top: 20px;
            align-self: flex-start;
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* Zapewnienie, że nie nakłada się i nie chowa */
            z-index: 10;
        }

        .section {
            background-color: var(--container-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px; }

        /* ULUBIONE - POPRAWKA MINIATUR I NUMERACJI */
        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .fav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 8px;
            position: relative;
        }

        /* Numer porządkowy */
        .fav-index {
            font-weight: bold;
            color: var(--accent-color);
            min-width: 25px;
            text-align: center;
            font-size: 0.9rem;
        }

        .fav-thumb-container {
            height: 60px; /* Stała wysokość zgodnie z prośbą */
            display: flex;
            align-items: center;
        }

        .fav-thumb {
            height: 100%;
            width: auto; /* Poprawka: proporcjonalny kształt, brak ścinania */
            border-radius: 4px;
            object-fit: contain; /* Zachowanie proporcji */
        }

        .fav-info {
            flex: 1;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Reszta stylów (siatka filmów itp.) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover { transform: scale(1.03); }

        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }

        .card-content { padding: 10px; font-size: 0.9rem; }

        .controls { margin-bottom: 20px; display: flex; gap: 10px; }

        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #222;
            color: white;
            flex: 1;
        }

        .remove-fav {
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="main-content">
        <div class="section">
            <div class="controls">
                <input type="text" id="search" placeholder="Szukaj w archiwum...">
            </div>
            <div id="video-grid" class="grid"></div>
        </div>
    </div>

    <div id="right-sidebar">
        <div class="section">
            <h2>Ulubione Piosenki</h2>
            <div id="favorites-list" class="favorites-list">
                <!-- Tu trafią piosenki z numerami i poprawnymi miniaturami -->
            </div>
        </div>
        
        <div class="section">
            <h2>Twoje Płyty</h2>
            <div id="albums-list">
                <!-- Treść kolumny płyt -->
                <p style="color: #666; font-size: 0.8rem;">Kolumna zablokowana w poziomie.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREUbe90S9t0vLz72L_hU6mG55W9_9P-W3NlVzTz2WpM_n_G6zB/pub?output=csv'; // Przykładowy URL
    const STORAGE_KEY = 'audiovisual_favs_v67';
    let videoData = [];
    let favorites = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Inicjalizacja danych
    function init() {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: (results) => {
                videoData = results.data;
                renderGrid(videoData);
                renderFavorites();
            }
        });

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = videoData.filter(v => 
                (v.title && v.title.toLowerCase().includes(term)) || 
                (v.author && v.author.toLowerCase().includes(term))
            );
            renderGrid(filtered);
        });
    }

    function renderGrid(data) {
        const grid = document.getElementById('video-grid');
        grid.innerHTML = data.map((item, index) => `
            <div class="card" onclick="addToFavorites(${index})">
                <img src="https://img.youtube.com/vi/${item.youtube_id}/mqdefault.jpg" alt="${item.title}">
                <div class="card-content">
                    <strong>${item.title || 'Bez tytułu'}</strong><br>
                    <small>${item.author || 'Nieznany'}</small>
                </div>
            </div>
        `).join('');
    }

    // MODYFIKACJA: Renderowanie ulubionych z numerami i poprawnymi proporcjami
    function renderFavorites() {
        const list = document.getElementById('favorites-list');
        list.innerHTML = favorites.map((item, index) => `
            <div class="fav-item">
                <div class="fav-index">${index + 1}</div>
                <div class="fav-thumb-container">
                    <img class="fav-thumb" src="https://img.youtube.com/vi/${item.youtube_id}/mqdefault.jpg" alt="thumb">
                </div>
                <div class="fav-info">
                    <strong>${item.title}</strong><br>
                    <small>${item.author}</small>
                </div>
                <button class="remove-fav" onclick="removeFavorite(${index})">×</button>
            </div>
        `).join('');
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
    }

    window.addToFavorites = (index) => {
        const item = videoData[index];
        if (!favorites.some(f => f.youtube_id === item.youtube_id)) {
            favorites.unshift(item);
            renderFavorites();
        }
    };

    window.removeFavorite = (index) => {
        favorites.splice(index, 1);
        renderFavorites();
    };

    init();
</script>

</body>
</html>
