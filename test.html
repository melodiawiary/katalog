<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Melodia Wiary - v69 STABLE</title>
    <style>
        :root { 
            --active-orange: #fbda80;
            --bg: #f4f9f8; --card-bg: #f9fffe;
            --soft-cyan: #d2e9e6; --deep-brown: #3b2a00; --sidebar-width: 220px;
        }
        
        body.standard { --f-size: 16px; --f-btn: 13px; --f-ctrl: 11px; --f-search: 1.1em; --f-card-title: 14px; --f-list-title: 1em; }
        body.senior { --f-size: 22px; --f-btn: 18px; --f-ctrl: 16px; --f-search: 1.4em; --f-card-title: 20px; --f-list-title: 1.4em; }

        body { background: var(--bg); color: var(--deep-brown); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; min-height: 100vh; font-size: var(--f-size); overflow-x: hidden; }

        /* SIDEBAR */
        #sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 4px solid var(--active-orange); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-top { padding: 15px 10px; text-align: center; border-bottom: 1px solid rgba(59, 42, 0, 0.08); }
        .sidebar-scroll { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--active-orange); background: white; object-fit: cover; margin-bottom: 15px; }
        .section-label { font-size: 16px; font-weight: 900; color: var(--deep-brown); text-transform: uppercase; margin: 15px 0 0 0; display: block; border-bottom: 3px solid var(--active-orange); padding-bottom: 5px; text-align: center; }
        .nav-btn, .size-btn { width: 100%; padding: 12px 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--deep-brown); cursor: pointer; font-weight: 800; text-align: left; text-transform: uppercase; font-size: var(--f-btn); background: var(--soft-cyan); color: var(--deep-brown); display: flex; align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s; box-sizing: border-box; }
        .nav-btn:hover { background: var(--active-orange); transform: scale(1.02); }
        .nav-btn.active, .size-btn.active { background: var(--active-orange) !important; border: 3px solid var(--deep-brown) !important; transform: scale(1.02); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .nav-btn.fav-btn { background: #fff1f1; border-color: #ffb3b3; align-items: center; justify-content: center; text-align: center; padding: 10px; min-height: 40px; margin-bottom: 5px; }

        /* MAIN CONTENT */
        #main-content { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; width: calc(100% - var(--sidebar-width)); }
        .header-sticky { position: sticky; top: 0; z-index: 950; background: var(--bg); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        .top-padding { display: flex; width: 100%; box-sizing: border-box; gap: 0; padding: 0; align-items: stretch; }
        .header-left { width: 50%; padding: 20px 25px 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .header-right { width: 50%; background: #fff5f5; border-left: 2px solid var(--active-orange); box-sizing: border-box; padding: 20px 25px 15px 25px; display: flex; flex-direction: column; }
        .top-header-title { font-weight: 900; text-transform: uppercase; font-size: 1.1em; text-align: center; margin-bottom: 10px; color: var(--deep-brown); line-height: 1.2; background: #ffcccc; border: 2px solid var(--deep-brown); padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .top-mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .top-btn-container { flex: 1; display: flex; flex-direction: column; border: 2px solid var(--deep-brown); border-radius: 8px; overflow: hidden; cursor: pointer; }
        .top-btn-text-part { height: 33.33%; background: var(--active-orange); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; font-weight: 900; text-transform: uppercase; font-size: 18px; line-height: 1.1; border-bottom: 2px solid var(--deep-brown); }
        .top-btn-ad-part { flex-grow: 1; background: white; display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-size: 16px; font-weight: 900; color: var(--deep-brown); text-transform: uppercase; line-height: 1.2; }

        .search-box { width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--deep-brown); font-size: var(--f-search); font-weight: bold; text-align: center; background: var(--card-bg); box-sizing: border-box; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        .ctrl-btn { flex: 1; padding: 12px 4px; border: 1px solid var(--deep-brown); background: var(--soft-cyan); color: var(--deep-brown); font-weight: 800; cursor: pointer; border-radius: 6px; text-transform: uppercase; font-size: var(--f-ctrl); transition: transform 0.2s, background 0.2s; }
        .ctrl-btn.active { background: var(--active-orange) !important; border: 2.5px solid var(--deep-brown); }

        .alpha-shelf { border-top: 3px solid var(--active-orange); border-bottom: 3px solid var(--active-orange); background: var(--bg); padding: 10px 25px; display: none; }
        #alpha-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .alpha-btn { padding: 6px 12px; font-size: 14px; font-weight: 900; border: 1px solid var(--deep-brown); background: var(--soft-cyan); color: var(--deep-brown); cursor: pointer; border-radius: 4px; min-width: 38px; }

        .view-title-header { background: var(--soft-cyan); color: var(--deep-brown); padding: 15px 25px; font-weight: 900; text-transform: uppercase; font-size: 1.5em; border-bottom: 5px solid var(--active-orange); border-top: 2px solid var(--active-orange); width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; }

        #main-display { padding: 0 0 400px 0; min-height: 100vh; width: 100%; }
        .display-padding { padding: 0 25px; width: 100%; box-sizing: border-box; }
        
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .list-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }

        .card { background: var(--card-bg); border: 2px solid rgba(59, 42, 0, 0.08); padding: 12px; border-radius: 15px; text-align: center; position: relative; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .card:hover { border: 2px solid var(--deep-brown); background: var(--soft-cyan); transform: translateY(-5px); }
        .thumb-container { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(0,0,0,0.05); position: relative; }
        .thumb { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-weight: 900; font-size: var(--f-card-title); text-transform: uppercase; padding: 5px; line-height: 1.2; }
        .play-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--active-orange); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: var(--deep-brown); font-weight: 900; text-align: center; padding: 10px; font-size: 0.9em; text-transform: uppercase; border: 2px solid var(--deep-brown); border-radius: 10px; box-sizing: border-box; }
        .card:hover .play-overlay { opacity: 1; }

        /* FAV / DISC LAYOUT */
        .fav-layout { display: flex; gap: 20px; align-items: flex-start; margin-top: 20px; }
        .fav-column { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }
        .disc-column { flex: 1; display: flex; flex-direction: column; gap: 30px; position: sticky; top: 350px; }
        .disc-box { border: 4px solid var(--deep-brown); border-radius: 20px; background: white; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .disc-header { background: var(--active-orange); padding: 12px; border-radius: 10px; font-weight: 900; text-align: center; border: 2px solid var(--deep-brown); font-size: 14px; }
        .disc-progress { background: #eee; border-radius: 10px; height: 25px; margin-top: 10px; overflow: hidden; border: 1px solid var(--deep-brown); position: relative; }
        .disc-progress-bar { height: 100%; background: #4caf50; transition: 0.3s; width: 0%; }
        .disc-progress-text { position: absolute; width: 100%; text-align: center; font-size: 12px; font-weight: 900; top: 3px; }
        .qty-controls { display: flex; align-items: center; border: 2px solid var(--deep-brown); border-radius: 8px; overflow: hidden; height: 35px; background: white; }
        .qty-btn { background: var(--soft-cyan); border: none; width: 35px; height: 100%; cursor: pointer; font-weight: 900; font-size: 18px; }
        .qty-val { width: 45px; text-align: center; font-weight: 900; font-size: 16px; }
        
        #fav-modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .fav-modal { background: white; border: 4px solid var(--active-orange); padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; text-align: center; font-weight: 900; }
        .disc-counter-box { background: var(--active-orange); border: 2px solid var(--deep-brown); padding: 10px; border-radius: 10px; font-weight: 900; text-align: center; text-transform: uppercase; font-size: 0.75em; flex: 1.5; }
    </style>
</head>
<body class="standard">

<div id="sidebar">
    <div class="sidebar-top">
        <img src="logo.png" class="logo-img" onerror="this.src='https://via.placeholder.com/120?text=LOGO'">
        <button class="nav-btn fav-btn" id="btn-cart" onclick="setView('cart')">❤️ MOJE ULUBIONE</button>
        <button class="nav-btn fav-btn" id="btn-top50-side" onclick="setView('top50')">🏆 TOP 50</button>
        <div style="margin-top:10px; padding:5px; border: 1px solid var(--deep-brown); border-radius:10px;">
           <button class="size-btn" id="s-std" onclick="updateSize('standard')">LITERY ZWYKŁE</button>
           <button class="size-btn" id="s-big" onclick="updateSize('senior')">LITERY DUŻE</button>
        </div>
        <span class="section-label">KATEGORIE</span>
    </div>
    <div class="sidebar-scroll" id="cat-list"></div>
</div>

<div id="main-content">
    <div class="header-sticky">
        <div class="top-padding">
            <div class="header-left">
                <input type="text" id="search" class="search-box" placeholder="SZUKAJ W KATALOGU PIEŚNI..." onkeyup="doSearch()">
                <div class="btn-group">
                    <button class="ctrl-btn" id="s-new" onclick="setSort('newest')">Najnowsze</button>
                    <button class="ctrl-btn" id="s-az" onclick="setSort('az')">A - Z</button>
                </div>
                <div class="btn-group">
                    <button class="ctrl-btn" id="m-grid" onclick="setMode('grid')">Miniatury</button>
                    <button class="ctrl-btn" id="m-list" onclick="setMode('list')">Lista</button>
                </div>
            </div>
            <div class="header-right" id="top-panel"></div>
        </div>
        <div id="alpha-shelf" class="alpha-shelf"><div id="alpha-row"></div></div>
        <div id="sticky-title-container"></div>
    </div>
    <div id="main-display"></div>
</div>

<div id="fav-modal-overlay">
    <div class="fav-modal">
        <div id="modal-text">Ta piosenka jest na płycie. Usuwamy z obu miejsc?</div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="ctrl-btn" style="background:#ffcccc;" onclick="modalAction('both')">TAK, Z OBU</button>
            <button class="ctrl-btn" onclick="modalAction('fav-only')">TYLKO Z ULUBIONYCH</button>
            <button class="ctrl-btn" style="background:#eee;" onclick="closeModal()">ANULUJ</button>
        </div>
    </div>
</div>

<script>
    const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSIMZUO8ZkisiFoqOfypL9hOQBnTbAvtMmBeIuK56_QoiXFu_b7i-de1Jn6Km9symosxJBV6V5PxKO/pub?output=csv';
    const CSV_TOP = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeNOmR7SJ-G5j8DMMXjR1KE4h5w1UiNY5nHhV1mvGNJ63I_-3SQPDMNxNFpakUL4VLFacWFUOmycPB/pub?gid=1082900381&single=true&output=csv';
    const STORAGE_KEY = 'mv_fav_v1'; 
    const STORAGE_DISC = 'mv_disc_v1';
    const STORAGE_QTYS = 'mv_qty_v1';

    let songs = [], top50 = [], cart = [], disc = [], discQtys = {}, currentView = 'all', displayMode = 'grid', query = "", sortType = 'newest';
    let pendingFavTitle = null;

    function openYT(id) { if(id) window.open(`https://www.youtube.com/watch?v=${id}`, '_blank'); }

    function timeToSeconds(t) {
        if(!t) return 0;
        let p = t.split(':').map(Number);
        return p.length === 2 ? p[0]*60 + p[1] : p[0]*3600 + p[1]*60 + p[2];
    }

    function secondsToTime(s) {
        let m = Math.floor(s/60); let sec = s%60;
        return m + ":" + (sec < 10 ? '0' : '') + sec;
    }

    async function init() {
        cart = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        disc = JSON.parse(localStorage.getItem(STORAGE_DISC) || '[]');
        discQtys = JSON.parse(localStorage.getItem(STORAGE_QTYS) || '{}');
        updateSize(localStorage.getItem('mv_font') || 'standard');

        try {
            const [r1, r2] = await Promise.all([fetch(CSV), fetch(CSV_TOP)]);
            const t1 = await r1.text(); const t2 = await r2.text();

            songs = t1.split('\n').slice(1).filter(l => l).map((l, i) => {
                const c = l.split(',');
                return { tytul: c[0], kategorie: (c[1]||"").split(';'), yt: (c[2]||"").trim(), czas: c[3]||"3:00", originalIndex: i };
            });

            top50 = t2.split('\n').slice(1).filter(l => l).map((l, i) => {
                const c = l.split(',');
                return { tytul: c[0], yt: (c[1]||"").trim(), originalIndex: i };
            });

            const cats = [...new Set(songs.flatMap(s => s.kategorie))].sort();
            const cb = document.getElementById('cat-list');
            cats.forEach(cat => {
                if(!cat) return;
                const b = document.createElement('button'); b.className = 'nav-btn'; b.innerText = cat;
                b.onclick = () => setView(cat); cb.appendChild(b);
            });
            render();
        } catch(e) { console.error(e); }
    }

    function updateSize(s) { document.body.className = s; localStorage.setItem('mv_font', s); }

    function toggleFav(t) {
        const idx = cart.findIndex(x => x.tytul === t);
        if(idx > -1) {
            if(disc.some(x => x.tytul === t)) { pendingFavTitle = t; document.getElementById('fav-modal-overlay').style.display='flex'; return; }
            cart.splice(idx, 1);
        } else {
            const s = songs.find(x => x.tytul === t) || top50.find(x => x.tytul === t);
            if(s) cart.push(s);
        }
        save(); render();
    }

    function toggleDisc(t) {
        const idx = disc.findIndex(x => x.tytul === t);
        if(idx > -1) disc.splice(idx, 1);
        else { const s = songs.find(x => x.tytul === t); if(s) disc.push(s); }
        save(); render();
    }

    function updateDiscQty(idx, delta) {
        let val = (discQtys[idx] || 0) + delta;
        discQtys[idx] = Math.max(0, val);
        save(); render();
    }

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
        localStorage.setItem(STORAGE_DISC, JSON.stringify(disc));
        localStorage.setItem(STORAGE_QTYS, JSON.stringify(discQtys));
    }

    function closeModal() { document.getElementById('fav-modal-overlay').style.display='none'; }
    function modalAction(type) {
        cart = cart.filter(x => x.tytul !== pendingFavTitle);
        if(type==='both') disc = disc.filter(x => x.tytul !== pendingFavTitle);
        save(); closeModal(); render();
    }

    function render() {
        const out = document.getElementById('main-display');
        out.innerHTML = '';
        const stick = document.getElementById('sticky-title-container');
        stick.innerHTML = `<div class="view-title-header"><div>${currentView.toUpperCase()}</div></div>`;

        let list = (currentView === 'cart') ? cart : (currentView === 'top50' ? top50 : (currentView === 'all' ? songs : songs.filter(s => s.kategorie.includes(currentView))));
        if(query) list = list.filter(s => s.tytul.toLowerCase().includes(query));

        const container = document.createElement('div');
        container.className = 'display-padding';

        if(currentView === 'cart') {
            const layout = document.createElement('div'); layout.className = 'fav-layout';
            const left = document.createElement('div'); left.className = 'fav-column';
            const right = document.createElement('div'); right.className = 'disc-column';

            // Logika podziału na płyty (50 min)
            const discs = []; let curIdx = 0; let curTime = 0;
            disc.forEach(s => {
                let st = timeToSeconds(s.czas);
                if(!discs[curIdx]) discs[curIdx] = [];
                if(curTime + st > 3000) { curIdx++; curTime = st; discs[curIdx] = [s]; }
                else { curTime += st; discs[curIdx].push(s); }
            });

            // Lista ulubionych
            list.forEach(s => {
                const item = document.createElement('div'); item.className = 'card';
                item.style.flexDirection = 'row'; item.style.padding = '10px';
                const dIdx = discs.findIndex(d => d.some(x => x.tytul === s.tytul));
                item.innerHTML = `
                    <div class="thumb-container" style="width:120px; margin:0;"><img src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" class="thumb"></div>
                    <div style="flex:1; text-align:left; padding-left:15px;">
                        ${dIdx > -1 ? `<b style="color:red; font-size:10px;">PŁYTA ${dIdx+1}</b><br>` : ''}
                        <b>${s.tytul}</b>
                    </div>
                    <button class="ctrl-btn" onclick="toggleFav('${s.tytul}')">USUŃ</button>
                    ${dIdx === -1 ? `<button class="ctrl-btn" style="background:orange" onclick="toggleDisc('${s.tytul}')">DO PŁYTY</button>` : ''}
                `;
                left.appendChild(item);
            });

            // Płyty po prawej
            discs.forEach((dSongs, i) => {
                let total = dSongs.reduce((a, s) => a + timeToSeconds(s.czas), 0);
                const dBox = document.createElement('div'); dBox.className = 'disc-box';
                dBox.innerHTML = `
                    <div class="disc-header">PŁYTA NUMER ${i+1}</div>
                    <div class="disc-progress"><div class="disc-progress-bar" style="width:${(total/3000)*100}%"></div></div>
                    <div style="display:flex; justify-content:space-between; margin-top:10px;">
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateDiscQty(${i}, -1)">-</button>
                            <div class="qty-val">${discQtys[i]||0}</div>
                            <button class="qty-btn" onclick="updateDiscQty(${i}, 1)">+</button>
                        </div>
                        <button class="ctrl-btn" style="background:#4caf50; color:white">ZAMÓW</button>
                    </div>
                    <div style="margin-top:10px; font-size:12px;">${dSongs.map(s => `<div>• ${s.tytul} <button onclick="toggleDisc('${s.tytul}')">x</button></div>`).join('')}</div>
                `;
                right.appendChild(dBox);
            });

            layout.appendChild(left); layout.appendChild(right); container.appendChild(layout);
        } else {
            const grid = document.createElement('div'); grid.className = displayMode === 'grid' ? 'items-grid' : 'list-container';
            list.forEach(s => {
                const card = document.createElement('div'); card.className = 'card';
                card.onclick = () => openYT(s.yt);
                card.innerHTML = `
                    <div class="thumb-container"><img src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" class="thumb"></div>
                    <div class="card-title">${s.tytul}</div>
                    <button class="ctrl-btn" onclick="event.stopPropagation(); toggleFav('${s.tytul}')">ULUBIONE</button>
                `;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }
        out.appendChild(container);
    }

    function setView(v) { currentView = v; render(); }
    function setSort(s) { sortType = s; render(); }
    function setMode(m) { displayMode = m; render(); }
    function doSearch() { query = document.getElementById('search').value.toLowerCase(); render(); }

    init();
</script>
</body>
</html>
