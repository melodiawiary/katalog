<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Melodia Wiary</title>

<style>

:root{
    --bg:#f7f7f7;
    --card:#ffffff;
    --accent:#f4d35e;
    --text:#222;
    --border:#dcdcdc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    padding:15px;
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:28px;
    font-weight:900;
    text-align:center;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:2px solid #ccc;
    font-size:18px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:12px;
    background:white;
    border-bottom:1px solid var(--border);
}

.categories button{
    flex:none;
    border:none;
    background:#ececec;
    padding:12px 18px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

.categories button.active{
    background:var(--accent);
}

/* LIST */

#songs{
    padding:10px;
    padding-bottom:120px;
}

.song{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:14px;
    border:1px solid var(--border);
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
}

.song-content{
    padding:14px;
}

.title{
    font-size:20px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:8px;
}

.time{
    color:#777;
    margin-bottom:14px;
}

.actions{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.play-btn{
    background:#ececec;
}

.fav-btn{
    background:var(--accent);
}

/* CART BAR */

.cart-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    color:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:9999;
}

.cart-btn{
    background:var(--accent);
    border:none;
    padding:14px 18px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:flex-end;
    z-index:10000;
}

.modal-content{
    background:white;
    width:100%;
    max-height:85vh;
    overflow:auto;
    border-radius:24px 24px 0 0;
    padding:20px;
}

.modal-title{
    font-size:24px;
    font-weight:900;
    margin-bottom:20px;
}

.cart-item{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.send-btn{
    width:100%;
    margin-top:20px;
    background:#4caf50;
    color:white;
    border:none;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:40px;
    color:#888;
}

</style>
</head>
<body>

<div class="header">

    <div class="logo">
        MELODIA WIARY
    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Szukaj pieśni..."
    />

</div>

<div class="categories" id="categories"></div>

<div id="songs"></div>

<div class="cart-bar">

    <div id="cart-count">
        ❤️ Wybrane: 0
    </div>

    <button class="cart-btn" onclick="openCart()">
        OTWÓRZ
    </button>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-title">
            Wybrane pieśni
        </div>

        <div id="cart-items"></div>

        <button class="send-btn" onclick="sendOrder()">
            WYŚLIJ ZAMÓWIENIE
        </button>

    </div>

</div>

<script>

const CSV =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSIMZUO8ZkisiFoqOfypL9hOQBnTbAvtMmBeIuK56_QoiXFu_b7i-de1Jn6Km9symosxJBV6V5PxKO/pub?output=csv';

let songs = [];
let filtered = [];
let cart = [];
let currentCategory = 'ALL';

/* CSV */

function parseCSV(text){

    const lines = text.split('\n');

    return lines.slice(1).map(line=>{

        const cols = line.split(',');

        return {
            title:(cols[0] || '').replaceAll('"',''),
            categories:(cols[1] || '').split(','),
            yt:(cols[2] || '').trim(),
            time:(cols[3] || '').trim()
        };

    });

}

/* LOAD */

async function loadSongs(){

    const res = await fetch(CSV);

    const text = await res.text();

    songs = parseCSV(text);

    filtered = [...songs];

    renderCategories();

    renderSongs();

}

/* CATEGORIES */

function renderCategories(){

    const box = document.getElementById('categories');

    const categories = new Set();

    songs.forEach(s=>{

        s.categories.forEach(c=>{

            if(c.trim()){
                categories.add(c.trim());
            }

        });

    });

    box.innerHTML = '';

    const allBtn = document.createElement('button');

    allBtn.innerText = 'WSZYSTKIE';

    allBtn.classList.add('active');

    allBtn.onclick = ()=>{

        currentCategory = 'ALL';

        updateCategoryButtons(allBtn);

        filterSongs();

    };

    box.appendChild(allBtn);

    [...categories].sort().forEach(cat=>{

        const btn = document.createElement('button');

        btn.innerText = cat;

        btn.onclick = ()=>{

            currentCategory = cat;

            updateCategoryButtons(btn);

            filterSongs();

        };

        box.appendChild(btn);

    });

}

function updateCategoryButtons(active){

    document.querySelectorAll('.categories button')
        .forEach(b=>b.classList.remove('active'));

    active.classList.add('active');

}

/* SEARCH */

document.getElementById('search')
.addEventListener('input',filterSongs);

function filterSongs(){

    const q = document.getElementById('search')
        .value
        .toLowerCase();

    filtered = songs.filter(s=>{

        const matchesSearch =
            s.title.toLowerCase().includes(q);

        const matchesCat =
            currentCategory === 'ALL'
            ||
            s.categories.includes(currentCategory);

        return matchesSearch && matchesCat;

    });

    renderSongs();

}

/* RENDER */

function renderSongs(){

    const box = document.getElementById('songs');

    box.innerHTML = '';

    filtered.forEach(song=>{

        const isFav = cart.some(x=>x.yt===song.yt);

        const div = document.createElement('div');

        div.className = 'song';

        div.innerHTML = `

            <img
                class="thumb"
                src="https://img.youtube.com/vi/${song.yt}/mqdefault.jpg"
            >

            <div class="song-content">

                <div class="title">
                    ${song.title}
                </div>

                <div class="time">
                    ${song.time}
                </div>

                <div class="actions">

                    <button
                        class="btn play-btn"
                        onclick="playSong('${song.yt}')"
                    >
                        ▶ ODTWÓRZ
                    </button>

                    <button
                        class="btn fav-btn"
                        onclick="toggleCart('${song.yt}')"
                    >
                        ${isFav ? '❌ USUŃ' : '❤️ DODAJ'}
                    </button>

                </div>

            </div>

        `;

        box.appendChild(div);

    });

}

/* PLAY */

function playSong(id){

    window.open(
        'https://www.youtube.com/watch?v=' + id,
        '_blank'
    );

}

/* CART */

function toggleCart(id){

    const song = songs.find(s=>s.yt===id);

    const exists = cart.find(x=>x.yt===id);

    if(exists){

        cart = cart.filter(x=>x.yt!==id);

    }else{

        cart.push(song);

    }

    updateCart();

    renderSongs();

}

function updateCart(){

    document.getElementById('cart-count')
        .innerText =
        `❤️ Wybrane: ${cart.length}`;

}

function openCart(){

    const modal = document.getElementById('modal');

    const box = document.getElementById('cart-items');

    modal.style.display = 'flex';

    if(cart.length===0){

        box.innerHTML =
        `<div class="empty">
            Nie dodano jeszcze pieśni
        </div>`;

        return;

    }

    box.innerHTML = '';

    cart.forEach(song=>{

        const div = document.createElement('div');

        div.className = 'cart-item';

        div.innerHTML = `
            <strong>${song.title}</strong>
            <br>
            ${song.time}
        `;

        box.appendChild(div);

    });

}

document.getElementById('modal')
.addEventListener('click',e=>{

    if(e.target.id==='modal'){

        e.target.style.display='none';

    }

});

/* SEND */

function sendOrder(){

    if(cart.length===0){

        alert('Koszyk jest pusty');

        return;

    }

    let text =
    'Dzień dobry, chciałbym zamówić następujące pieśni:%0A%0A';

    cart.forEach((s,i)=>{

        text +=
        `${i+1}. ${s.title}%0A`;

    });

    window.open(
        `https://m.me/MelodiaWiary`
    );

    alert(
        'Messenger został otwarty. Skopiuj listę pieśni i wyślij wiadomość.'
    );

    console.log(decodeURIComponent(text));

}

loadSongs();

</script>

</body>
</html>
