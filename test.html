<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Melodia Wiary - v69</title>
    <style>
        :root { 
            --active-orange: #fbda80;
            --bg: #f4f9f8; --card-bg: #f9fffe;
            --soft-cyan: #d2e9e6; --deep-brown: #3b2a00; --sidebar-width: 220px;
        }
        
        body.standard { 
            --f-size: 16px;
            --f-btn: 13px; --f-ctrl: 11px; --f-search: 1.1em; 
            --f-card-title: 14px; --f-list-title: 1em;
        }
        body.senior { 
            --f-size: 22px;
            --f-btn: 18px; --f-ctrl: 16px; --f-search: 1.4em; 
            --f-card-title: 20px; --f-list-title: 1.4em;
        }

        body { background: var(--bg); color: var(--deep-brown); font-family: 'Segoe UI', sans-serif; margin: 0;
            display: flex; min-height: 100vh; font-size: var(--f-size); overflow-x: hidden; }

        /* SIDEBAR */
        #sidebar { width: var(--sidebar-width);
            background: var(--card-bg); border-right: 4px solid var(--active-orange); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-top { padding: 15px 10px; text-align: center;
            border-bottom: 1px solid rgba(59, 42, 0, 0.08); }
        .sidebar-scroll { flex-grow: 1;
            overflow-y: auto; padding: 10px; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%;
            border: 3px solid var(--active-orange); background: white; object-fit: cover; margin-bottom: 15px;
            }
        
        .section-label { font-size: 16px;
            font-weight: 900; color: var(--deep-brown); text-transform: uppercase; margin: 15px 0 0 0; display: block; border-bottom: 3px solid var(--active-orange); padding-bottom: 5px;
            text-align: center;
            }
        
        .nav-btn, .size-btn { width: 100%;
            padding: 12px 10px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid var(--deep-brown); cursor: pointer; font-weight: 800; text-align: left; text-transform: uppercase;
            font-size: var(--f-btn); background: var(--soft-cyan); color: var(--deep-brown); display: flex;
            align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s; box-sizing: border-box;
            }
        
        .nav-btn:hover { background: var(--active-orange);
            transform: scale(1.02); }
        
        .nav-btn.active, .size-btn.active { 
            background: var(--active-orange) !important;
            border: 3px solid var(--deep-brown) !important; 
            transform: scale(1.02); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
            
        .nav-btn.fav-btn { background: #fff1f1;
            border-color: #ffb3b3;
            align-items: center; justify-content: center; text-align: center; padding: 10px; min-height: 40px; margin-bottom: 5px;
            }

        /* MAIN CONTENT */
        #main-content { margin-left: var(--sidebar-width);
            flex: 1; display: flex; flex-direction: column; width: calc(100% - var(--sidebar-width));
            }
        .header-sticky { position: sticky; top: 0;
            z-index: 950; background: var(--bg); width: 100%;
            box-sizing: border-box; display: flex; flex-direction: column; }
        
        .top-padding { display: flex;
            width: 100%; box-sizing: border-box; gap: 0; padding: 0; align-items: stretch; }
        
        .header-left { width: 50%;
            padding: 20px 25px 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        .header-right { width: 50%;
            background: #fff5f5; border-left: 2px solid var(--active-orange); box-sizing: border-box; padding: 20px 25px 15px 25px; display: flex; flex-direction: column;
            }
        
        .top-header-title { font-weight: 900;
            text-transform: uppercase; font-size: 1.1em; text-align: center; margin-bottom: 10px; color: var(--deep-brown); line-height: 1.2;
            background: #ffcccc; border: 2px solid var(--deep-brown); padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box;
            }
        .top-mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            }
        
        .top-btn-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            border: 2px solid var(--deep-brown); 
            border-radius: 8px; 
            overflow: hidden;
            cursor: pointer;
        }
        .top-btn-text-part { 
            height: 33.33%; 
            background: var(--active-orange); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 8px; 
            font-weight: 900; 
            text-transform: uppercase; 
            font-size: 18px; 
            line-height: 1.1;
            border-bottom: 2px solid var(--deep-brown);
        }
        .top-btn-ad-part { 
            flex-grow: 1; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: 900; 
            color: var(--deep-brown);
            text-transform: uppercase;
            line-height: 1.2;
        }

        .search-box { width: 100%;
            padding: 12px; border-radius: 15px; border: 2px solid var(--deep-brown);
            font-size: var(--f-search); font-weight: bold; text-align: center; background: var(--card-bg); box-sizing: border-box;
            }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;
            }
        
        .ctrl-btn { flex: 1;
            padding: 12px 4px; border: 1px solid var(--deep-brown);
            background: var(--soft-cyan); color: var(--deep-brown); font-weight: 800; cursor: pointer; border-radius: 6px; text-transform: uppercase;
            font-size: var(--f-ctrl); transition: transform 0.2s, background 0.2s;
            }
        .ctrl-btn:hover { background: var(--active-orange);
            transform: scale(1.02); }
        .ctrl-btn.active { background: var(--active-orange) !important; border: 2.5px solid var(--deep-brown);
            transform: scale(1.02); }

        .ad-placeholder { height: 100px;
            background: white; margin-top: 15px;
            border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #999; font-weight: bold; border-radius: 10px;
            }

        .alpha-shelf { border-top: 3px solid var(--active-orange);
            border-bottom: 3px solid var(--active-orange); background: var(--bg);
            padding: 10px 25px; display: none;
            }
        #alpha-row { display: flex; flex-wrap: wrap;
            gap: 6px; justify-content: flex-start;
            }
        .alpha-btn { padding: 6px 12px; font-size: 14px;
            font-weight: 900;
            border: 1px solid var(--deep-brown); background: var(--soft-cyan); color: var(--deep-brown); cursor: pointer; border-radius: 4px; min-width: 38px; transition: 0.2s;
            }
        .alpha-btn.active { background: var(--active-orange) !important; border: 2.5px solid var(--deep-brown);
            }

        .view-title-header { background: var(--soft-cyan); color: var(--deep-brown); padding: 15px 25px; font-weight: 900;
            text-transform: uppercase; font-size: 1.5em; border-bottom: 5px solid var(--active-orange); border-top: 2px solid var(--active-orange);
            width: 100%; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; text-align: center; gap: 10px;
            }

        #main-display { padding: 0 0 400px 0; min-height: 100vh; width: 100%;
            }
        .display-padding { padding: 0 25px; width: 100%; box-sizing: border-box;
            }
        
        .alpha-header { grid-column: 1 / -1;
            background: var(--active-orange); padding: 8px 20px; border-radius: 8px; font-weight: 900; margin: 40px 0 15px 0; border: 2px solid var(--deep-brown); font-size: 1.3em;
            text-align: left; scroll-margin-top: 400px; }
        
        .items-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }

        .list-container { 
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
            margin-top: 20px; 
        }

        @media (max-width: 1400px) { .list-container { grid-template-columns: repeat(4, 1fr);
            } }
        @media (max-width: 1100px) { .list-container { grid-template-columns: repeat(3, 1fr);
            } }
        @media (max-width: 800px) { .list-container { grid-template-columns: repeat(2, 1fr);
            } }
        @media (max-width: 500px) { .list-container { grid-template-columns: 1fr;
            } }

        .card { background: var(--card-bg);
            border: 2px solid rgba(59, 42, 0, 0.08);
            padding: 12px; border-radius: 15px; text-align: center; position: relative; transition: 0.3s; display: flex;
            flex-direction: column; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .card:hover { border: 2px solid var(--deep-brown);
            background: var(--soft-cyan); transform: translateY(-5px); }

        .card-rank { font-weight: 900; font-size: 1.2em; color: var(--deep-brown); margin-bottom: 5px; text-align: center; border-bottom: 1px solid var(--active-orange); padding-bottom: 2px; }
        
        .thumb-container { width: 100%;
            aspect-ratio: 16/9; border-radius: 10px;
            overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(0,0,0,0.05); position: relative;
            }
        .thumb { width: 100%; height: 100%; object-fit: cover;
            }
        .card-title { font-weight: 900; font-size: var(--f-card-title); text-transform: uppercase; padding: 5px; line-height: 1.2;
            }

        .play-overlay { position: absolute; top:0; left:0; width:100%; height:100%;
            background: var(--active-orange); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: var(--deep-brown); font-weight: 900;
            text-align: center; padding: 10px; font-size: 0.9em; text-transform: uppercase; border: 2px solid var(--deep-brown); border-radius: 10px; box-sizing: border-box; }
        .card:hover .play-overlay { opacity: 1;
            }
        .yt-btn-fake { background: var(--active-orange); border: 2px solid var(--deep-brown); padding: 8px 12px;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .btn-fav-toggle { margin-top: 10px;
            padding: 10px; border-radius: 10px; border: 1px solid var(--deep-brown); background: var(--soft-cyan); color: var(--deep-brown); font-weight: 900; font-size: 12px; text-transform: uppercase; cursor: pointer;
            transition: 0.2s; }
        .btn-fav-toggle:hover { background: var(--active-orange); }
        .btn-fav-toggle.is-active { background: var(--active-orange); border-width: 2.5px;
            }

        .list-card { background: var(--card-bg); border: 2px solid rgba(59, 42, 0, 0.08);
            border-radius: 10px; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; min-height: 60px; position: relative;
            overflow: hidden;
            }
        .list-card:hover { border: 2px solid var(--deep-brown); background: var(--active-orange);
            }
        .list-title { font-weight: 800; font-size: var(--f-list-title); flex: 1; padding-right: 10px; line-height: 1.2;
            text-transform: uppercase; color: var(--deep-brown); }
        
        .list-overlay { position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: var(--active-orange); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; color: var(--deep-brown); font-weight: 900;
            text-align: center; font-size: 0.9em;
            pointer-events: none; }
        .list-card:hover .list-overlay { opacity: 1;
            }

        .heart-btn { font-size: 24px; cursor: pointer; border: none; background: none; position: relative;
            z-index: 5; }

        .vote-btn-header {
            width: 100%; background: var(--active-orange); color: var(--deep-brown); border: 3px solid var(--deep-brown);
            padding: 12px; border-radius: 10px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; font-size: 0.7em; transition: transform 0.2s;
            margin-top: 5px; box-sizing: border-box;
        }
        .vote-btn-header:hover { transform: scale(1.01); }
        
        .instruction-box {
            margin-top: 50px; padding: 40px; background: white; border: 4px solid var(--active-orange);
            border-radius: 20px; text-align: center; font-weight: 800; font-size: 1.3em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* NOWE STYLE DLA WIDOKU ULUBIONYCH / PŁYTY */
        .fav-layout { display: flex; gap: 20px; align-items: flex-start; margin-top: 20px; }
        .fav-column { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .disc-column { flex: 1; display: flex; flex-direction: column; gap: 30px; position: sticky; top: 350px; }
        .disc-box { border: 4px solid var(--deep-brown); border-radius: 20px; background: white; padding: 20px; min-height: 100px; }
        .disc-header { background: var(--active-orange); padding: 15px; border-radius: 10px; font-weight: 900; text-align: center; margin-bottom: 15px; border: 2px solid var(--deep-brown); font-size: var(--f-btn); }
        .disc-progress { background: #eee; border-radius: 10px; height: 25px; margin-top: 10px; overflow: hidden; border: 1px solid var(--deep-brown); position: relative; }
        .disc-progress-bar { height: 100%; background: #4caf50; transition: 0.3s; width: 0%; }
        .disc-progress-text { position: absolute; width: 100%; text-align: center; font-size: 12px; font-weight: 900; top: 3px; }
        
        .on-disc-badge { color: #d32f2f; font-weight: 900; font-size: 1.1em; text-transform: uppercase; margin-bottom: 5px; }
        
        /* MODAL */
        #fav-modal-overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); 
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .fav-modal { 
            background: white; border: 4px solid var(--active-orange); padding: 30px; border-radius: 20px;
            max-width: 500px; width: 90%; text-align: center; font-weight: 900; 
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }

        .disc-counter-box {
            background: var(--active-orange); border: 2px solid var(--deep-brown); padding: 10px;
            border-radius: 10px; font-weight: 900; text-align: center; text-transform: uppercase;
            font-size: 0.7em; flex: 1;
        }

        /* STYLE DLA SELEKTORA ILOŚCI */
        .qty-controls {
            display: flex; align-items: center; border: 2px solid var(--deep-brown); border-radius: 8px; overflow: hidden; height: 100%;
        }
        .qty-btn {
            background: var(--soft-cyan); border: none; width: 30px; height: 100%; cursor: pointer; font-weight: 900; font-size: 16px;
        }
        .qty-btn:hover { background: var(--active-orange); }
        .qty-val {
            width: 40px; text-align: center; font-weight: 900; background: white; border-left: 2px solid var(--deep-brown); border-right: 2px solid var(--deep-brown);
        }

        @keyframes pulse-order {
            0%, 100% { transform: scale(1); box-shadow: 0 6px 18px rgba(229,57,53,0.4); }
            50% { transform: scale(1.04); box-shadow: 0 10px 28px rgba(229,57,53,0.7); }
        }
        #order-modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.75); display:none; align-items:center;
            justify-content:center; z-index:3000;
        }
        .order-modal {
            background: white; border: 5px solid var(--active-orange);
            padding: 40px 35px; border-radius: 24px; max-width: 600px;
            width: 92%; text-align: center; font-weight: 900;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .order-modal h2 {
            font-size: 1.6em; text-transform: uppercase;
            color: var(--deep-brown); margin: 0 0 10px 0;
        }
        .order-modal p {
            font-size: 1em; font-weight: 600; color: #555; margin-bottom: 30px;
        }
        .order-choice-btns {
            display: flex; flex-direction: column; gap: 15px;
        }
        .order-choice-btn {
            padding: 22px 20px; border-radius: 14px; border: 3px solid var(--deep-brown);
            font-size: 1.2em; font-weight: 900; cursor: pointer;
            text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none; display: flex; align-items: center;
            justify-content: center; gap: 12px; line-height: 1.2;
        }
        .order-choice-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .order-choice-btn.messenger { background: #0084ff; color: white; }
        .order-choice-btn.email { background: var(--active-orange); color: var(--deep-brown); }
        .order-modal-close {
            margin-top: 20px; background: #eee; border: 2px solid #999;
            border-radius: 10px; padding: 12px 24px; font-size: 1em;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }
        /* Podstrona z tekstem zamówienia */
        #order-text-view {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index:4000;
            align-items:center; justify-content:center;
        }
        .order-text-box {
            background: white; border: 5px solid var(--active-orange);
            border-radius: 20px; padding: 35px; max-width: 650px;
            width: 92%; max-height: 80vh; display: flex; flex-direction: column;
        }
        .order-text-box h2 {
            margin: 0 0 15px 0; font-size: 1.3em; text-transform: uppercase;
            color: var(--deep-brown); text-align: center;
        }
        .order-text-content {
            flex: 1; overflow-y: auto; background: #fffdf5;
            border: 2px solid var(--active-orange); border-radius: 10px;
            padding: 15px; font-size: 0.95em; font-weight: 600;
            line-height: 1.6; white-space: pre-wrap; text-align: left;
            color: var(--deep-brown);
        }
        .order-text-actions {
            display: flex; gap: 12px; margin-top: 18px;
        }
    </style>
</head>
<body class="standard">

            <button class="ctrl-btn" style="background:#ffcccc;" onclick="modalAction('both')">Z ULUBIONYCH I PŁYTY</button>

            <button class="ctrl-btn" style="background:#eee;" onclick="closeModal()">ANULUJ</button>
        </div>
    </div>
</div>

<script>
    const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSIMZUO8ZkisiFoqOfypL9hOQBnTbAvtMmBeIuK56_QoiXFu_b7i-de1Jn6Km9symosxJBV6V5PxKO/pub?output=csv';

    const STORAGE_KEY = 'melodia_wiary_permanent_storage'; 
    const STORAGE_DISC = 'melodia_wiary_disc_storage';
    const STORAGE_QTYS = 'melodia_wiary_qty_storage'; // NOWE: do przechowywania ilości
    let songs = [], top50 = [], cart = [], disc = [], discQtys = {}, currentView = 'all', displayMode = 'grid', query = "", sortType = 'newest';
    let pendingFavTitle = null;

    function openYT(id) {
        if(!id) return;
        window.open(`https://www.youtube.com/watch?v=${id}`, '_blank', 'noopener,noreferrer');
    }

    function parseCSVLine(text) {
        const result = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
            else cur += char;
        }
        result.push(cur.trim()); return result;
    }

    function timeToSeconds(t) {
        if(!t || typeof t !== 'string') return 0;
        let cleanTime = t.replace(/[^\d:]/g, ''); 
        let parts = cleanTime.split(':').map(Number);
        if(parts.length === 2) return (isNaN(parts[0]) ? 0 : parts[0]*60) + (isNaN(parts[1]) ? 0 : parts[1]);
        if(parts.length === 3) return (isNaN(parts[0]) ? 0 : parts[0]*3600) + (isNaN(parts[1]) ? 0 : parts[1]*60) + (isNaN(parts[2]) ? 0 : parts[2]);
        return 0;
    }

    function secondsToTime(s) {
        let m = Math.floor(s / 60);
        let sec = s % 60;
        return m + ":" + (sec < 10 ? '0' : '') + sec;
    }

    function updateSize(s) { 
        document.body.className = s; 
        document.getElementById('s-std').classList.toggle('active', s==='standard');
        document.getElementById('s-big').classList.toggle('active', s==='senior'); 
        localStorage.setItem('mv_font_permanent', s);
        render(); 
    }

    async function init() {
        let saved = localStorage.getItem(STORAGE_KEY);
        if(saved) cart = JSON.parse(saved);
        let savedDisc = localStorage.getItem(STORAGE_DISC);
        if(savedDisc) disc = JSON.parse(savedDisc);
        let savedQtys = localStorage.getItem(STORAGE_QTYS);
        if(savedQtys) discQtys = JSON.parse(savedQtys);

        updateSize(localStorage.getItem('mv_font_permanent') || 'standard');

        const alphabet = "ABCDEFGHIJKLŁMNOPRSTUWZŻ".split("");
        const row = document.getElementById('alpha-row');
        alphabet.forEach(l => {
            const b = document.createElement('button'); b.className = 'alpha-btn'; b.innerText = l;
            b.onclick = () => {
                document.querySelectorAll('.alpha-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                sortType = 'az'; render();
                const target = document.getElementById("anchor-" + l);
                if(target) window.scrollTo({ top: target.getBoundingClientRect().top + window.pageYOffset - 320, behavior: 'smooth' });
            };
            row.appendChild(b);
        });
        try {
            const r1 = await fetch(CSV + '&cb=' + Date.now());
            const text1 = await r1.text();

            const rows = text1.split(/\r?\n/).filter(x => x.trim() !== "").slice(1);
            let catsSet = new Set();
            songs = rows.map((line, index) => {
                const cols = parseCSVLine(line);
                let rawCats = (cols[1] || "Inne").split(',').map(c => c.trim()).filter(c => c.length > 2);
                rawCats.forEach(c => catsSet.add(c));
                return { tytul: cols[0] || "Bez tytułu", kategorie: rawCats, yt: (cols[2] || "").trim(), czas: cols[3] || "0:00", numer: (cols[4] || "").trim(), originalIndex: index };
            });

            cart = cart.map(cItem => {
                const updated = songs.find(s => s.tytul === cItem.tytul);
                return updated ? updated : cItem;
            });
            disc = disc.map(dItem => {
                const updated = songs.find(s => s.tytul === dItem.tytul);
                return updated ? updated : dItem;
            });

            const catBox = document.getElementById('cat-list');
            Array.from(catsSet).sort().forEach(cat => {
                const b = document.createElement('button'); 
                b.className = 'nav-btn category-link'; 
                b.innerText = cat; 
                b.dataset.view = cat; 
                b.onclick = () => setView(cat); 
                catBox.appendChild(b);
            });
            render();
        } catch(e) { console.error(e); }
    }

    function closeModal() {
        document.getElementById('fav-modal-overlay').style.display = 'none';
        pendingFavTitle = null;
    }

    function modalAction(type) {
        if(!pendingFavTitle) return;
        const title = pendingFavTitle;
        
        const idx = cart.findIndex(x => x.tytul === title);
        if(idx > -1) cart.splice(idx, 1);

        if(type === 'both') {
            const dIdx = disc.findIndex(x => x.tytul === title);
            if(dIdx > -1) disc.splice(dIdx, 1);
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
        localStorage.setItem(STORAGE_DISC, JSON.stringify(disc));
        closeModal();
        render();
    }

    function toggleFav(t) {
        const idx = cart.findIndex(x => x.tytul === t);
        if(idx > -1) {
            if(disc.some(x => x.tytul === t)) {
                pendingFavTitle = t;
                document.getElementById('fav-modal-overlay').style.display = 'flex';
                return;
            }
            cart.splice(idx, 1);
        }
        else { const s = [...songs, ...top50].find(x => x.tytul === t); if(s) cart.push(s); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
        render();
    }

    function toggleDisc(t) {
        const idx = disc.findIndex(x => x.tytul === t);
        if(idx > -1) disc.splice(idx, 1);
        else {
            const s = [...songs, ...top50].find(x => x.tytul === t);
            if(s) disc.push(s);
        }
        localStorage.setItem(STORAGE_DISC, JSON.stringify(disc));
        render();
    }

    // NOWE: Funkcja zarządzania ilością sztuk konkretnej płyty
    function updateDiscQty(discIdx, delta) {
        let current = discQtys[discIdx] || 0;
        let newVal = current + delta;
        if(newVal < 1) newVal = 1; // Minimum 1 sztuka jeśli ktoś kliknął dodaj
        discQtys[discIdx] = newVal;
        localStorage.setItem(STORAGE_QTYS, JSON.stringify(discQtys));
        render();
    }

    function renderTopPanel() { /* usunięto - miejsce na reklamę */ }

    // NOWE: Funkcja renderująca podstronę podsumowania zamówienia (koszyk)
    function renderOrderSummary() {
        currentView = 'order_summary';
        const out = document.getElementById('main-display');
        const stick = document.getElementById('sticky-title-container');
        stick.innerHTML = `<div class="view-title-header" style="justify-content:space-between;">
            <div>PODSUMOWANIE TWOICH PŁYT</div>
            <button class="ctrl-btn" style="max-width:200px; background:white;" onclick="setView('cart')">POWRÓT DO EDYCJI</button>
        </div>`;
        out.innerHTML = '';

        const discsTmp = [];
        const maxTime = 50 * 60;
        disc.forEach(s => {
            const sT = timeToSeconds(s.czas);
            // Znajdź pierwszą płytę gdzie się zmieści (bin packing)
            let placed = false;
            for (let i = 0; i < discsTmp.length; i++) {
                const usedTime = discsTmp[i].reduce((acc, x) => acc + timeToSeconds(x.czas), 0);
                if (usedTime + sT <= maxTime) {
                    discsTmp[i].push(s);
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                discsTmp.push([s]);
            }
        });

        const container = document.createElement('div');
        container.className = 'display-padding';
        container.style.marginTop = '20px';

        let msg = "Dzień dobry, chciałbym zamówić płyty z moimi ulubionymi pieśniami:\n\n";
        
        discsTmp.forEach((dSongs, idx) => {
            let qty = discQtys[idx] || 1;
            const section = document.createElement('div');
            section.className = 'disc-box';
            section.style.marginBottom = '20px';
            let songsList = dSongs.map((s, sIdx) => `${sIdx+1}. ${s.numer ? s.numer + '. ' : ''}${s.tytul} (${s.czas})`).join('<br>');
            section.innerHTML = `
                <div class="disc-header">PŁYTA NR ${idx + 1} - ILOŚĆ: ${qty} SZT.</div>
                <div style="padding:10px; font-weight:bold;">SPIS UTWORÓW NA TEJ PŁYCIE:</div>
                <div style="padding:0 10px 10px 10px; font-size:0.9em;">${songsList}</div>
            `;
            container.appendChild(section);
            msg += `PŁYTA NR ${idx+1} (${qty} szt.):\n` + dSongs.map(s => `- ${s.tytul}`).join('\n') + "\n\n";
        });

        if(container.innerHTML === "") {
            container.innerHTML = "<h3>Nie dodano żadnych płyt do zamówienia (ilość 0).</h3>";
        } else {
            const footer = document.createElement('div');
            footer.className = 'instruction-box';
            footer.innerHTML = `
                <h2 style="text-transform:uppercase;">Finalizuj zamówienie</h2>
                <p>Wybierz formę kontaktu, aby przesłać do mnie listę wybranych przez Ciebie płyt:</p>
                <div style="display:flex; gap:15px; justify-content:center; margin-top:20px;">
                    <a href="https://m.me/twoj_profil_fb" target="_blank" class="ctrl-btn" style="background:#0084ff; color:white; padding:15px; text-decoration:none; display:flex; align-items:center; justify-content:center;">NAPISZ NA MESSENGERZE</a>
                    <a href="mailto:kontakt@melodiawiary.pl?subject=Zamówienie Płyt&body=${encodeURIComponent(msg)}" class="ctrl-btn" style="background:#4caf50; color:white; padding:15px; text-decoration:none; display:flex; align-items:center; justify-content:center;">NAPISZ NA ADRES E-MAIL</a>
                </div>
            `;
            container.appendChild(footer);
        }
        out.appendChild(container);
    }

    function render() {
        if(currentView === 'order_summary') { renderOrderSummary(); return; }
        const out = document.getElementById('main-display');
        const stickyTitleContainer = document.getElementById('sticky-title-container');
        out.innerHTML = '';
        stickyTitleContainer.innerHTML = '';
        renderTopPanel();

        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.remove('active');
            if(currentView === 'cart' && b.id === 'btn-cart') b.classList.add('active');

            else if(currentView === 'all' && b.id === 'cat-all') b.classList.add('active');
            else if(b.dataset.view === currentView) b.classList.add('active');
        });

        document.querySelectorAll('.ctrl-btn').forEach(b => {
            b.classList.remove('active');
            if(b.id === 's-' + sortType.replace('newest','new').replace('oldest','old')) b.classList.add('active');
            if(b.id === 'm-' + displayMode) b.classList.add('active');
        });

        const showAlphaBar = (displayMode === 'list' && currentView !== 'cart');
        document.getElementById('alpha-shelf').style.display = showAlphaBar ? 'block' : 'none';

        const header = document.createElement('div');
        header.className = 'view-title-header';
        
        let titleLine = document.createElement('div');
        titleLine.style.flex = "2";
        titleLine.innerText = currentView === 'all' ? 'WSZYSTKIE PIEŚNI' : (currentView === 'cart' ? '❤️ MOJE ULUBIONE' : '📂 ' + currentView);
        header.appendChild(titleLine);

        if(currentView === 'cart') {
            const discsTmp = [];
            let cIndex = 0; let cTime = 0; const mTime = 50 * 60;
            disc.forEach(s => {
                const sT = timeToSeconds(s.czas);
                if (!discsTmp[cIndex]) discsTmp[cIndex] = [];
                if (cTime + sT > mTime && discsTmp[cIndex].length > 0) { cIndex++; cTime = sT; discsTmp[cIndex] = [s]; }
                else { cTime += sT; discsTmp[cIndex].push(s); }
            });
                  

            const counterDiv = document.createElement('div');
            counterDiv.className = 'disc-counter-box';
            counterDiv.style.flex = "3";
            counterDiv.style.display = "flex";
            counterDiv.style.alignItems = "center";
            counterDiv.style.justifyContent = "space-between";
            counterDiv.style.padding = "5px 15px";
            
            counterDiv.innerHTML = `
${infoText}</div>
                <button onclick="openOrderModal()" style="background:#e53935; color:white; border:4px solid #3b2a00; border-radius:14px; font-size:22px; font-weight:900; padding:18px 32px; cursor:pointer; text-transform:uppercase; letter-spacing:1px; box-shadow:0 6px 18px rgba(229,57,53,0.4); animation: pulse-order 1.5s infinite;">🛒 ZAMÓW PŁYTY</button>
            `;
            header.appendChild(counterDiv);
        }


        stickyTitleContainer.appendChild(header);

        let list = [];
        if(currentView === 'cart') list = [...cart];

        else if(currentView === 'all') list = [...songs];
        else list = songs.filter(s => s.kategorie.includes(currentView));

        if(query) list = list.filter(s => s.tytul.toLowerCase().includes(query));

        if(sortType === 'newest') list.sort((a,b) => b.originalIndex - a.originalIndex);
        else if(sortType === 'oldest') list.sort((a,b) => a.originalIndex - b.originalIndex);
        else if(sortType === 'az') list.sort((a,b) => a.tytul.localeCompare(b.tytul, 'pl'));
        else if(sortType === 'za') list.sort((a,b) => b.tytul.localeCompare(a.tytul, 'pl'));

        const contentBox = document.createElement('div');
        contentBox.className = 'display-padding';

        if(currentView === 'cart') {
            const layout = document.createElement('div');
            layout.className = 'fav-layout';
            
            const leftCol = document.createElement('div');
            leftCol.className = 'fav-column';
            
            const discs = [];
            let currentDiscIndex = 0;
            let currentDiscTime = 0;
            const maxTime = 50 * 60;

            disc.forEach(s => {
                const sTime = timeToSeconds(s.czas);
                // Znajdź pierwszą płytę gdzie się zmieści (bin packing)
                let placed = false;
                for (let i = 0; i < discs.length; i++) {
                    const usedTime = discs[i].reduce((acc, x) => acc + timeToSeconds(x.czas), 0);
                    if (usedTime + sTime <= maxTime) {
                        discs[i].push(s);
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    discs.push([s]);
                }
            });

            list.forEach(s => {
                const foundDiscIndex = discs.findIndex(d => d.some(x => x.tytul === s.tytul));
                const isDisc = foundDiscIndex > -1;
                const jsTytul = s.tytul.replace(/'/g, "\\'");
                const item = document.createElement('div');
                item.className = 'card';
                item.style.flexDirection = 'row';
                item.style.alignItems = 'center';
                item.style.padding = '10px';
                item.onclick = () => openYT(s.yt);
                item.innerHTML = `
                    <div class="thumb-container" style="width:160px; margin-bottom:0; aspect-ratio:16/9;">
                        <img src="https://img.youtube.com/vi/${s.yt}/mqdefault.jpg" class="thumb">
                    </div>
                    <div class="card-title" style="flex:1; text-align:left; padding-left:15px;">
                        ${isDisc ? `<div class="on-disc-badge">JEST NA PŁYCIE NUMER ${foundDiscIndex + 1}</div>` : ''}
                        ${s.numer ? s.numer + '. ' : ''}${s.tytul} <br><small>Czas: ${s.czas}</small>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <button class="ctrl-btn" style="background:#fff1f1; font-size:var(--f-ctrl); min-width:120px;" onclick="event.stopPropagation(); toggleFav('${jsTytul}')">
                            USUŃ Z ULUBIONYCH
                        </button>
                        ${!isDisc ? `
                        <button class="ctrl-btn" style="background:var(--active-orange); font-size:var(--f-ctrl); min-width:120px;" onclick="event.stopPropagation(); toggleDisc('${jsTytul}')">
                            DODAJ DO PŁYTY
                        </button>` : ''}
                    </div>
                `;
                leftCol.appendChild(item);
            });

            const rightCol = document.createElement('div');
            rightCol.className = 'disc-column';
            
            if (discs.length === 0) {
                const emptyBox = document.createElement('div');
                emptyBox.className = 'disc-box';
                emptyBox.innerHTML = '<div class="disc-header">PŁYTA JEST PUSTA</div>';
                rightCol.appendChild(emptyBox);
            } else {
                discs.forEach((dSongs, idx) => {
                    let dTotal = dSongs.reduce((acc, s) => acc + timeToSeconds(s.czas), 0);
                    let dPercent = Math.min((dTotal / maxTime) * 100, 100);
                    let currentQty = discQtys[idx] || 0;

                    const dBox = document.createElement('div');
                    dBox.className = 'disc-box';
                    dBox.innerHTML = `
                        <div style="display: flex; gap: 10px; align-items: stretch; margin-bottom: 15px;">
                            <div class="disc-header" style="flex: 2; margin-bottom: 0;">PŁYTA NUMER ${idx + 1} MELODIA WIARY</div>
                            
                            <div style="flex: 1.5; display:flex; flex-direction:column; gap:5px;">
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="updateDiscQty(${idx}, -1)">-</button>
                                    <div class="qty-val">${currentQty}</div>
                                    <button class="qty-btn" onclick="updateDiscQty(${idx}, 1)">+</button>
                                </div>
                                <button class="ctrl-btn" style="background: ${currentQty > 0 ? '#4caf50' : '#fbda80'}; color: ${currentQty > 0 ? 'white' : 'inherit'}; padding:5px; font-size:9px;" onclick="updateDiscQty(${idx}, 1)">
                                    ${currentQty > 0 ? 'DODANO DO ZAMÓWIENIA' : 'DODAJ PŁYTĘ DO ZAMÓWIENIA'}
                                </button>
                            </div>
                        </div>
                        <div class="disc-progress">
                            <div class="disc-progress-bar" style="width: ${dPercent}%; background: #4caf50"></div>
                            <div class="disc-progress-text">${secondsToTime(dTotal)} / 50:00</div>
                        </div>
                        <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
                            ${dSongs.map(s => {
                                const inFav = cart.some(x => x.tytul === s.tytul);
                                return `
                                <div class="list-card" style="background:#fff9e6; border:1px solid #333; min-height:40px; padding: 5px 15px;">
                                    <span class="list-title" style="font-size:var(--f-list-title);">
                                        ${s.numer ? s.numer + '. ' : ''}${s.tytul} (${s.czas}) 
                                        ${!inFav ? '<span class="on-disc-badge" style="margin-left:10px; font-size:0.8em;">- nie jest w ulubionych</span>' : ''}
                                    </span>
                                    <button class="ctrl-btn" style="max-width:100px; font-size:var(--f-ctrl); padding:4px;" onclick="event.stopPropagation(); toggleDisc('${s.tytul.replace(/'/g, "\\'")}')">USUŃ Z PŁYTY</button>
                                </div>
                            `}).join('')}
                        </div>
                    `;
                    rightCol.appendChild(dBox);
                });
            }

            layout.appendChild(leftCol);
            layout.appendChild(rightCol);
            contentBox.appendChild(layout);
        } else {
            const container = document.createElement('div');
            container.className = displayMode === 'grid' ? 'items-grid' : 'list-container';
            
            let lastChar = "";
            const showHeaders = (sortType === 'az' || sortType === 'za') && !query && currentView !== 'cart';

            list.forEach((s, idx) => {
                const firstChar = s.tytul.charAt(0).toUpperCase();
                if(showHeaders && firstChar !== lastChar) {
                    const h = document.createElement('div'); h.className = 'alpha-header'; h.id = "anchor-" + firstChar; h.innerText = firstChar; container.appendChild(h); lastChar = firstChar;
                }

                const item = document.createElement('div');
                const isFav = cart.some(x => x.tytul === s.tytul);
                const jsTytul = s.tytul.replace(/'/g, "\\'");
                
                if(displayMode === 'grid') {
                    item.className = 'card';
                    if(!s.dummy) item.onclick = () => openYT(s.yt);
                    item.innerHTML = `

                        <div class="thumb-container">
                            <img src="${s.dummy ? 'https://via.placeholder.com/320x180?text=...' : `https://img.youtube.com/vi/${s.yt}/mqdefault.jpg`}" class="thumb">
                            ${!s.dummy ? `<div class="play-overlay"><div class="yt-btn-fake">KLIKNIJ, ABY OTWORZYĆ NA YOUTUBE 🎶</div></div>` : ''}
                        </div>
                        <div class="card-title">${s.numer ? s.numer + '. ' : ''}${s.tytul}</div>
                        ${!s.dummy ? `<button class="btn-fav-toggle ${isFav ? 'is-active' : ''}" onclick="event.stopPropagation(); toggleFav('${jsTytul}')">${isFav ? '❌ USUŃ Z ULUBIONYCH' : '➕ DODAJ DO ULUBIONYCH'}</button>` : ''}
                    `;
                } else {
                    item.className = 'list-card';
                    if(!s.dummy) item.onclick = () => openYT(s.yt);
                    item.innerHTML = `
                        ${!s.dummy ? `<div class="list-overlay">KLIKNIJ, ABY OTWORZYĆ NA YOUTUBE 🎶</div>` : ''}
                        <span class="list-title">${s.numer ? s.numer + '. ' : ''}${s.tytul}</span>
                        ${!s.dummy ? `<button class="heart-btn" onclick="event.stopPropagation(); toggleFav('${jsTytul}')">${isFav ? '❤️' : '🤍'}</button>` : ''}
                    `;
                }
                container.appendChild(item);
            });
            contentBox.appendChild(container);
        }



        out.appendChild(contentBox);
    }

    function setMode(m) { 
        displayMode = m; 
        if(m === 'grid') { sortType = 'newest'; } 
        else if(m === 'list') { sortType = 'az'; }
        render(); window.scrollTo(0, 0);
    }
    function setSort(s) { sortType = s; render(); }
    function setView(v) { 
        currentView = v; 
        render(); window.scrollTo(0,0); 
    }
    function doSearch() { query = document.getElementById('search').value.toLowerCase(); render(); }
    init();

    function buildOrderText() {
        const discsTmp = [];
        const maxTime = 50 * 60;
        disc.forEach(s => {
            const sT = timeToSeconds(s.czas);
            let placed = false;
            for (let i = 0; i < discsTmp.length; i++) {
                const usedTime = discsTmp[i].reduce((acc, x) => acc + timeToSeconds(x.czas), 0);
                if (usedTime + sT <= maxTime) { discsTmp[i].push(s); placed = true; break; }
            }
            if (!placed) discsTmp.push([s]);
        });
        let msg = "Szczęść Boże Melodio Wiary!\nJestem zainteresowany płytami z tą muzyką:\n\n";
        discsTmp.forEach((dSongs, idx) => {
            let qty = discQtys[idx] || 1;
            msg += `PŁYTA NUMER ${idx+1} (${qty} szt.):\n`;
            dSongs.forEach(s => {
                msg += `  ${s.numer ? s.numer + '. ' : ''}${s.tytul} (${s.czas})\n`;
            });
            msg += "\n";
        });
        msg += "Proszę o kontakt w sprawie zamówienia. Bóg zapłać!";
        return msg;
    }

    function openOrderModal() {
        if(disc.length === 0) {
            alert("Nie masz jeszcze żadnych piosenek na płycie! Dodaj najpierw utwory do płyty.");
            return;
        }
        const msg = buildOrderText();
        const messengerUrl = "https://m.me/MelodiaWiary?text=" + encodeURIComponent(msg);
        document.getElementById('messenger-btn').href = messengerUrl;
        document.getElementById('order-modal-overlay').style.display = 'flex';
    }

    function closeOrderModal() {
        document.getElementById('order-modal-overlay').style.display = 'none';
    }

    function showOrderText() {
        closeOrderModal();
        const msg = buildOrderText();
        document.getElementById('order-text-content').textContent = msg;
        document.getElementById('order-text-view').style.display = 'flex';
    }

    function closeOrderText() {
        document.getElementById('order-text-view').style.display = 'none';
    }

    function copyOrder() {
        const text = document.getElementById('order-text-content').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('[onclick="copyOrder()"]');
            const original = btn.innerHTML;
            btn.innerHTML = '✅ SKOPIOWANO!';
            btn.style.background = '#388e3c';
            setTimeout(() => { btn.innerHTML = original; btn.style.background = '#4caf50'; }, 2500);
        });
    }

</script>

                ✉️ NAPISZ NA MELODIAWIARY@GMAIL.COM<br>
                <span style="font-size:0.75em; font-weight:700;">(skopiuj swoje zamówienie)</span>
            </button>
        </div>
        <button class="order-modal-close" onclick="closeOrderModal()">ANULUJ</button>
    </div>
</div>

<div id="order-text-view">
    <div class="order-text-box">
        <h2>✉️ Twoje zamówienie — skopiuj i wyślij</h2>
        <div id="order-text-content" class="order-text-content"></div>
        <div class="order-text-actions">
            <button onclick="copyOrder()" style="flex:2; padding:18px; background:#4caf50; color:white; border:3px solid #333; border-radius:12px; font-size:1.1em; font-weight:900; cursor:pointer; text-transform:uppercase;">
                📋 KOPIUJ MOJE ZAMÓWIENIE
            </button>
            <button onclick="closeOrderText()" style="flex:1; padding:18px; background:#eee; border:2px solid #999; border-radius:12px; font-size:1em; font-weight:900; cursor:pointer; text-transform:uppercase;">
                ZAMKNIJ
            </button>
        </div>
    </div>
</div>
</body>
