<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melodia Wiary</title>

<style>

:root{
    --bg:#f5f5f5;
    --card:#ffffff;
    --accent:#f4d35e;
    --text:#222;
    --border:#dddddd;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:Arial,sans-serif;
    color:var(--text);
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    background:white;
    z-index:1000;
    padding:15px;
    border-bottom:1px solid var(--border);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:18px;
    border-radius:14px;
    border:2px solid #ccc;
    font-size:18px;
}

/* CATEGORY */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:12px;
    background:white;
    border-bottom:1px solid var(--border);
}

.categories button{
    border:none;
    background:#ececec;
    padding:12px 18px;
    border-radius:999px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
    flex:none;
    font-size:15px;
}

.categories button.active{
    background:var(--accent);
}

/* SONGS */

#songs{
    padding:12px;
    padding-bottom:120px;
}

.song{
    background:white;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:16px;
    border:1px solid var(--border);
}

.thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
}

.song-content{
    padding:15px;
}

.title{
    font-size:22px;
    font-weight:900;
    line-height:1.3;
    margin-bottom:8px;
}

.time{
    color:#777;
    margin-bottom:15px;
    font-size:15px;
}

.actions{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.play-btn{
    background:#ececec;
}

.fav-btn{
    background:var(--accent);
}

/* CART BAR */

.cart-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    color:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:9999;
}

.cart-btn{
    border:none;
    background:var(--accent);
    padding:14px 18px;
    border-radius:12px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:flex-end;
    z-index:10000;
}

.modal-content{
    width:100%;
    max-height:85vh;
    overflow:auto;
    background:white;
    border-radius:24px 24px 0 0;
    padding:20px;
}

.modal-title{
    font-size:26px;
    font-weight:900;
    margin-bottom:20px;
}

.cart-item{
    padding:14px 0;
    border-bottom:1px solid #eee;
    font-size:18px;
}

.remove-btn{
    margin-top:8px;
    border:none;
    background:#ffdddd;
    padding:10px;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
}

.send-btn{
    width:100%;
    margin-top:25px;
    border:none;
    background:#4caf50;
    color:white;
    padding:20px;
    border-radius:14px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:50px;
    color:#888;
    font-size:18px;
}

</style>
</head>
<body>

<div class="header">

    <div class="logo">
        MELODIA WIARY
    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Szukaj pieśni..."
    >

</div>

<div class="categories" id="categories"></div>

<div id="songs"></div>

<div class="cart-bar">

    <div id="cart-count">
        ❤️ Wybrane: 0
    </div>

    <button class="cart-btn" onclick="openCart()">
        OTWÓRZ
    </button>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-title">
            Wybrane pieśni
        </div>

        <div id="cart-items"></div>

        <button class="send-btn" onclick="sendOrder()">
            WYŚLIJ ZAMÓWIENIE
        </button>

    </div>

</div>

<script>

const CSV =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSIMZUO8ZkisiFoqOfypL9hOQBnTbAvtMmBeIuK56_QoiXFu_b7i-de1Jn6Km9symosxJBV6V5PxKO/pub?output=csv';

let songs = [];
let filtered = [];
let cart = [];
let currentCategory = 'ALL';

/* CSV */

function parseCSV(text){

    const lines = text.split('\n');

    return lines.slice(1).map(line=>{

        const cols = line.split(',');

        return {
            title:(cols[0] || '').replaceAll('"',''),
            categories:(cols[1] || '').split(','),
            yt:(cols[2] || '').trim(),
            time:(cols[3] || '').trim()
        };

    });

}

/* LOAD */

async function loadSongs(){

    const res = await fetch(CSV);

    const text = await res.text();

    songs = parseCSV(text);

    filtered = [...songs];

    renderCategories();

    renderSongs();

}

function renderCategories(){

    const box = document.getElementById('categories');

    const categories = new Set();

    songs.forEach(song=>{

        song.categories.forEach(cat=>{

            if(cat.trim()){
                categories.add(cat.trim());
            }

        });

    });

    box.innerHTML = '';

    const allBtn = document.createElement('button');

    allBtn.innerText = 'WSZYSTKIE';

    allBtn.classList.add('active');

    allBtn.onclick = ()=>{

        currentCategory = 'ALL';

        updateButtons(allBtn);

        filterSongs();

    };

    box.appendChild(allBtn);

    [...categories].sort().forEach(cat=>{

        const btn = document.createElement('button');

        btn.innerText = cat;

        btn.onclick = ()=>{

            currentCategory = cat;

            updateButtons(btn);

            filterSongs();

        };

        box.appendChild(btn);

    });

}

function updateButtons(active){

    document.querySelectorAll('.categories button')
    .forEach(btn=>btn.classList.remove('active'));

    active.classList.add('active');

}

document
.getElementById('search')
.addEventListener('input',filterSongs);

function filterSongs(){

    const q =
    document
    .getElementById('search')
    .value
    .toLowerCase();

    filtered = songs.filter(song=>{

        const matchesSearch =
        song.title.toLowerCase().includes(q);

        const matchesCategory =
        currentCategory === 'ALL'
        ||
        song.categories.includes(currentCategory);

        return matchesSearch && matchesCategory;

    });

    renderSongs();

}

function renderSongs(){

    const box = document.getElementById('songs');

    box.innerHTML = '';

    filtered.forEach(song=>{

        const isFav =
        cart.some(x=>x.yt===song.yt);

        const div = document.createElement('div');

        div.className = 'song';

        div.innerHTML = `

            <img
                class="thumb"
                src="https://img.youtube.com/vi/${song.yt}/mqdefault.jpg"
            >

            <div class="song-content">

                <div class="title">
                    ${song.title}
                </div>

                <div class="time">
                    ${song.time}
                </div>

                <div class="actions">

                    <button
                        class="btn play-btn"
                        onclick="playSong('${song.yt}')"
                    >
                        ▶ ODTWÓRZ
                    </button>

                    <button
                        class="btn fav-btn"
                        onclick="toggleCart('${song.yt}')"
                    >
                        ${isFav ? '❌ USUŃ' : '❤️ DODAJ'}
                    </button>

                </div>

            </div>

        `;

        box.appendChild(div);

    });

}

function playSong(id){

    window.open(
        'https://www.youtube.com/watch?v=' + id,
        '_blank'
    );

}

function toggleCart(id){

    const song =
    songs.find(s=>s.yt===id);

    const exists =
    cart.find(x=>x.yt===id);

    if(exists){

        cart =
        cart.filter(x=>x.yt!==id);

    }else{

        cart.push(song);

    }

    updateCart();

    renderSongs();

}

function updateCart(){

    document
    .getElementById('cart-count')
    .innerText =
    `❤️ Wybrane: ${cart.length}`;

}

function openCart(){

    const modal =
    document.getElementById('modal');

    const box =
    document.getElementById('cart-items');

    modal.style.display = 'flex';

    if(cart.length===0){

        box.innerHTML =
        `<div class="empty">
            Nie dodano jeszcze pieśni
        </div>`;

        return;

    }

    box.innerHTML = '';

    cart.forEach(song=>{

        const div =
        document.createElement('div');

        div.className = 'cart-item';

        div.innerHTML = `

            <strong>
                ${song.title}
            </strong>

            <br>

            ${song.time}

            <br>

            <button
                class="remove-btn"
                onclick="toggleCart('${song.yt}')"
            >
                USUŃ
            </button>

        `;

        box.appendChild(div);

    });

}

document
.getElementById('modal')
.addEventListener('click',e=>{

    if(e.target.id==='modal'){

        e.target.style.display='none';

    }

});

function sendOrder(){

    if(cart.length===0){

        alert('Koszyk jest pusty');

        return;

    }

    let text =
`Dzień dobry, chciałbym zamówić następujące pieśni:

`;

    cart.forEach((song,index)=>{

        text +=
`${index+1}. ${song.title}
`;

    });

    navigator.clipboard
    .writeText(text)
    .then(()=>{

        window.open(
            'https://m.me/61574568862717',
            '_blank'
        );

        alert(
`Treść zamówienia została skopiowana.

Messenger został otwarty.

Wklej wiadomość w czacie.`
        );

    });

}

loadSongs();

</script>

</body>
</html>
